<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive study guide for Basic Immunology Lecture 1">
<title>Immunology Lecture 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Rubik:wght@500;700;800&family=Heebo:wght@400;700&display=swap">
<style>
/* Layout: sticky stain-strip nav, one study chapter per view, wide content column with side panels for interactive pieces. Palette borrowed from an H&E / Giemsa blood smear. */
:root{
  --bg:#f5f4fa; --surface:#ffffff; --sunk:#ebe8f4; --line:#d9d4ea;
  --ink:#231d3d; --muted:#615a7d;
  --hema:#4f3fae; --hema-soft:#e4e0f7;   /* hematoxylin: nuclei, adaptive */
  --eosin:#c43b72; --eosin-soft:#f9e1ea; /* eosin: cytoplasm, innate */
  --good:#1f7a55; --good-soft:#dcf1e6; --bad:#b4372f; --bad-soft:#f8e0dd;
  --f-display:"Bricolage Grotesque","Rubik",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Heebo",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono","Heebo",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14121d; --surface:#1d1a2a; --sunk:#262236; --line:#383250;
  --ink:#ece9f7; --muted:#a59fc0;
  --hema:#a99cff; --hema-soft:#2e2752; --eosin:#f27aa6; --eosin-soft:#3d1f2d;
  --good:#5fd09a; --good-soft:#173628; --bad:#ff8a80; --bad-soft:#3d1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14121d; --surface:#1d1a2a; --sunk:#262236; --line:#383250;
  --ink:#ece9f7; --muted:#a59fc0;
  --hema:#a99cff; --hema-soft:#2e2752; --eosin:#f27aa6; --eosin-soft:#3d1f2d;
  --good:#5fd09a; --good-soft:#173628; --bad:#ff8a80; --bad-soft:#3d1d1b; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:700;letter-spacing:-.01em}
h3{font-size:1.2rem;font-weight:700}
p{margin:0;max-width:68ch}
.mono{font-family:var(--f-mono);font-size:.85em}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:1.1rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hema);outline-offset:2px;border-radius:6px}

/* header + nav */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-size:1.25rem!important}
.hactions{display:flex;gap:6px;align-items:center}
.hbtn{display:inline-flex;align-items:center;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:.9rem;cursor:pointer;list-style:none;white-space:nowrap}
.hbtn::-webkit-details-marker{display:none}
.hbtn:hover{border-color:var(--hema)}
.lmenu{position:relative}
.lmenu-pop{position:absolute;inset-inline-end:0;top:calc(100% + 6px);width:min(340px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,10,50,.18);padding:6px;display:flex;flex-direction:column;gap:2px}
.lmenu-pop a,.lmenu-pop .dis{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.92rem;line-height:1.3}
.lmenu-pop a:hover{background:var(--sunk)}
.lmenu-pop .dis{color:var(--muted);opacity:.7}
.lmenu-pop .mono{flex:none;width:2.2em;color:var(--muted)}
.lmenu-pop .home{border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;font-weight:700}
.sub{border-top:1px solid var(--line);background:var(--bg)}
.subbar{display:flex;align-items:center;gap:16px;padding-block:8px;flex-wrap:wrap}
.subtitle{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.subname{font-family:var(--f-display);font-weight:700;font-size:.98rem}
.subbar>nav.tabs{max-width:100%}
@media (max-width:760px){.subbar{flex-direction:column;align-items:stretch;gap:6px;flex-wrap:nowrap}.subbar>nav.tabs{width:100%;flex:none}.brand{font-size:1.05rem!important}}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.05rem;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 40% 40%,var(--hema) 0 35%,var(--eosin) 36%);display:inline-block}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);padding:7px 12px;border-radius:999px;font-size:.92rem;font-weight:700;white-space:nowrap}
nav.tabs a:hover{color:var(--ink);background:var(--sunk)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.prog{height:3px;background:var(--sunk)}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--eosin),var(--hema));transition:width .3s}

main{padding-block:36px 80px}
section.view{display:flex;flex-direction:column;gap:40px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.callout{border-inline-start:4px solid var(--hema);background:var(--hema-soft);padding:14px 16px;border-radius:0 10px 10px 0}
.callout.pink{border-color:var(--eosin);background:var(--eosin-soft)}
.pill{display:inline-block;font-family:var(--f-mono);font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.inn{background:var(--eosin-soft);color:var(--eosin)}
.pill.ada{background:var(--hema-soft);color:var(--hema)}
ul.clean{margin:0;padding-inline-start:1.1em;display:flex;flex-direction:column;gap:6px}
ul.clean li::marker{color:var(--eosin)}
.next{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:700;text-decoration:none;color:var(--ink);display:inline-flex;gap:8px;align-items:center}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:hover{border-color:var(--hema)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:620px}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.smear{aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle,var(--eosin-soft),var(--bg) 72%);display:grid;place-items:center}
.smear svg{width:92%;height:auto}
.howto{display:flex;flex-wrap:wrap;gap:8px}

/* requirement explorer */
.req{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:16px}
@media (max-width:700px){.req{grid-template-columns:1fr}}
.reqlist{display:flex;flex-direction:column;gap:4px}
@media (max-width:700px){.reqlist{flex-direction:row;flex-wrap:wrap}}
.reqlist button{text-align:start;border:1px solid transparent;background:none;padding:8px 12px;border-radius:10px;display:flex;gap:10px;align-items:baseline}
.reqlist button .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.reqlist button[aria-pressed="true"]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--eosin)}
.reqpanel h3{font-size:1.5rem}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
@media (max-width:640px){.vs{grid-template-columns:1fr}.vs .mid{display:none}}
.vs .mid{display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--muted)}

/* innate vs adaptive */
.armswitch{display:flex;gap:6px;flex-wrap:wrap}
.armswitch button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:700}
.armswitch button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cmp{display:flex;flex-direction:column;gap:10px}
.cmprow{display:grid;grid-template-columns:120px 1fr 1fr;gap:10px;align-items:stretch}
@media (max-width:600px){.cmprow{grid-template-columns:1fr 1fr}.cmprow .k{grid-column:1/-1}}
.cmprow .k{font-family:var(--f-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);align-self:center}
.cmprow .c{padding:10px 12px;border-radius:10px;transition:opacity .2s,transform .2s}
.cmprow .i{background:var(--eosin-soft)}
.cmprow .a{background:var(--hema-soft)}
.cmp[data-focus="innate"] .a,.cmp[data-focus="adaptive"] .i{opacity:.3}
.cmprow.head .c{font-family:var(--f-display);font-weight:700;background:none;padding-block:0}
.cmprow.head .i{color:var(--eosin)} .cmprow.head .a{color:var(--hema)}

/* cell explorer */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:.88rem}
.filters button[aria-pressed="true"]{background:var(--hema);color:var(--bg);border-color:var(--hema)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.cellbtn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .2s,border-color .2s,transform .15s}
.cellbtn svg{width:72px;height:72px}
.cellbtn span{font-weight:700;font-size:.88rem;text-align:center;line-height:1.2}
.cellbtn.dim{opacity:.22}
.cellbtn[aria-pressed="true"]{border-color:var(--eosin);box-shadow:0 0 0 2px var(--eosin)}
.cellbtn:hover{transform:translateY(-2px)}
.celldetail{display:grid;grid-template-columns:150px 1fr;gap:18px}
@media (max-width:600px){.celldetail{grid-template-columns:1fr}}
.celldetail svg{width:150px;height:150px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem}
.facts dt{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:3px}
.facts dd{margin:0}

/* tabs inside */
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;flex-wrap:wrap;width:fit-content;max-width:100%}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* extravasation */
.extra svg{width:100%;height:auto;display:block}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:10px;font-weight:700;font-size:.9rem}
.steps button[aria-pressed="true"]{border-color:var(--eosin);color:var(--eosin)}
#wbc{transition:transform .9s cubic-bezier(.5,0,.3,1)}
@media (prefers-reduced-motion:reduce){#wbc,.cmprow .c,.cellbtn,.flip-inner{transition:none!important}}

/* timeline */
.tl input[type=range]{width:100%;accent-color:var(--eosin)}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:700px){.layers{grid-template-columns:1fr}}
.layer{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);transition:opacity .25s,border-color .25s}
.layer.off{opacity:.35}
.layer.now{border-color:var(--eosin);box-shadow:0 0 0 1px var(--eosin)}
.layer h4{font-size:1rem}
.clock{font-family:var(--f-display);font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}

/* flow */
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.flow .node{flex:1 1 150px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.flow .arrow{align-self:center;color:var(--muted);font-family:var(--f-mono)}
@media (max-width:640px){.flow{flex-direction:column}.flow .arrow{transform:rotate(90deg);align-self:center}}

/* reveal */
details.reveal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.reveal summary{cursor:pointer;font-weight:700}
details.reveal[open] summary{margin-bottom:8px}

/* lesson picker */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lesson{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);min-width:0}
a.lesson:hover{border-color:var(--eosin);transform:translateY(-2px)}
a.lesson{transition:transform .15s,border-color .15s;box-shadow:inset 0 3px 0 var(--eosin)}
.lesson.soon{background:var(--sunk);color:var(--muted)}
.lesson .lt{font-family:var(--f-display);font-weight:700;font-size:1.08rem;line-height:1.25}
.lesson .lm{display:flex;justify-content:space-between;gap:8px;align-items:center}
.lesson .lm .eyebrow{white-space:nowrap}
.pill.live{background:var(--good-soft);color:var(--good)}
.brand{text-decoration:none;color:var(--ink)}
/* figures */
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow-x:auto}
.fig svg{width:100%;height:auto;display:block}
.fig svg.wide{min-width:520px}
.fig figcaption{font-size:.9rem;color:var(--muted);max-width:68ch}
.fig text,svg.mini text{font-family:var(--f-body);font-size:13px;fill:var(--ink)}
.fig text.m,svg.mini text.m{fill:var(--muted);font-size:12px}
.fig text.b,svg.mini text.b{font-weight:700}
.fig text.h,svg.mini text.h{font-family:var(--f-display);font-weight:700;font-size:16px}
.fig text.mono,svg.mini text.mono{font-family:var(--f-mono);font-size:11px}
svg.mini{width:100%;max-width:260px;height:auto;display:block}
#innbody{display:flex;flex-direction:column;gap:14px}
.orggrid{display:grid;grid-template-columns:minmax(220px,280px) 1fr;gap:14px;align-items:start}
@media (max-width:700px){.orggrid{grid-template-columns:1fr}.orggrid .fig.body svg{max-width:260px;margin:0 auto}}
.organ{cursor:pointer;transition:opacity .2s}
.fig.body svg>g:first-of-type,.fig.body svg>rect,.fig.body svg>circle{pointer-events:none}
.organ:hover{opacity:.75}
.organ.on{filter:drop-shadow(0 0 5px var(--eosin))}
.celldetail .fig{grid-column:1/-1}
/* rtl */
svg{direction:ltr}
.extra text{font-family:var(--f-body);font-size:12px;fill:var(--muted)}
[dir="rtl"] .callout{border-radius:10px 0 0 10px}
[dir="rtl"] .reqlist button[aria-pressed="true"]{box-shadow:inset -3px 0 0 var(--eosin)}
[dir="rtl"] .eyebrow,[dir="rtl"] th,[dir="rtl"] .cmprow .k{letter-spacing:0}
[dir="rtl"] h1,[dir="rtl"] h2{letter-spacing:0}
[dir="rtl"] .eyebrow,[dir="rtl"] .pill,[dir="rtl"] th,[dir="rtl"] .cmprow .k,[dir="rtl"] .facts dt,[dir="rtl"] .flow .arrow,[dir="rtl"] .reqlist .n,[dir="rtl"] .score{font-family:var(--f-body);letter-spacing:0}
[dir="rtl"] .eyebrow{font-size:.8rem}
.chart text[style*="rtl"]{font-family:var(--f-body);font-size:12px}
.flow[style*="column"] .node{flex:none}
.stack>.pill{align-self:flex-start}
@media (max-width:640px){.flow .node{flex:none}}
@media (max-width:640px){[dir="rtl"] .flow .arrow{transform:rotate(-90deg)}}
#langbtn{font-family:var(--f-body)}
@media (max-width:520px){#hhome{display:none}.hbtn{padding:6px 10px}.bar{gap:8px}}
/* lesson 2 + tips */
.tip{border-bottom:1.5px dotted var(--hema);cursor:help;border-radius:2px}
.tip:hover,.tip:focus-visible{background:var(--hema-soft);outline:none}
#tipbox{position:fixed;z-index:50;max-width:min(300px,calc(100vw - 16px));background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:.88rem;line-height:1.45;box-shadow:0 8px 24px rgba(20,10,50,.25);pointer-events:none}
#tipbox b{font-family:var(--f-display)}
#tipbox::after{content:"";position:absolute;left:var(--ax);top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--ink)}
#tipbox.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--ink)}
a.node{text-decoration:none;color:inherit}
a.node:hover{border-color:var(--eosin)}
.comp{cursor:pointer}
.comp.on{filter:drop-shadow(0 0 6px var(--eosin))}
.orggrid.wideL{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.orggrid>*{min-width:0}
.prrfig svg{max-width:720px;margin:0 auto}
@media (max-width:860px){.orggrid.wideL{grid-template-columns:1fr}}
.steps-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps-list li{counter-increment:s;display:grid;grid-template-columns:2rem 1fr;gap:2px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.steps-list li::before{content:counter(s);grid-row:span 2;width:2rem;height:2rem;border-radius:50%;background:var(--hema-soft);color:var(--hema);display:grid;place-items:center;font-weight:700}
.steps-list li span{grid-column:2;color:var(--muted)}
.steps-list li.fail{border-color:var(--bad);background:var(--bad-soft)}
.steps-list li.fail::before{content:"!";background:var(--bad);color:var(--bg)}
.nkchecks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 16px}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.chk input{accent-color:var(--eosin);width:18px;height:18px;flex:none}
.verdict{padding:12px 14px;border-radius:10px;border:1px solid var(--line)}
.verdict.kill{background:var(--bad-soft);border-color:var(--bad)}
.verdict.spare{background:var(--good-soft);border-color:var(--good)}
.card h4{font-family:var(--f-display);font-size:1rem}
/* quiz */
.qcard{max-width:760px}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopts button{text-align:start;border:1px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:10px}
.qopts button:hover:not(:disabled){border-color:var(--hema)}
.qopts button.right{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.qopts button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.qopts button:disabled{cursor:default}
.qmeta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.score{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.expl{border-radius:10px;padding:12px 14px;background:var(--sunk)}

/* flashcards */
.flip{perspective:1200px;max-width:620px;width:100%;height:260px;cursor:pointer;border:0;background:none;padding:0}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--hema-soft)}
.face .term{font-family:var(--f-display);font-weight:800;font-size:1.7rem}
.fcnav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gloss div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.93rem}
.gloss b{font-family:var(--f-display)}
#glossq{width:100%;max-width:360px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
</style>

<script>
let LANG = 'en';
/* ---------- cell drawings (Giemsa-style) ---------- */
const nucleus = 'fill="var(--hema)" fill-opacity=".85"';
const CELLSVG = {
  neutrophil:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="url(#cyto)" stroke="var(--eosin)" stroke-opacity=".5"/>${[[34,42],[50,36],[64,48],[52,62]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="10" ${nucleus}/>`).join('')}<path d="M34 42 L50 36 L64 48 L52 62" stroke="var(--hema)" stroke-width="3" fill="none"/></svg>`,
  monocyte:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="url(#cyto)" stroke="var(--eosin)" stroke-opacity=".5"/><path d="M28 40 C30 22 70 22 72 42 C74 60 58 70 50 56 C44 68 26 60 28 40Z" ${nucleus}/></svg>`,
  macrophage:`<svg viewBox="0 0 100 100"><path d="M14 52 C10 28 36 10 56 14 C80 18 92 40 86 60 C80 84 52 92 32 84 C18 78 16 66 14 52Z" fill="url(#cyto)" stroke="var(--eosin)" stroke-opacity=".5"/><ellipse cx="52" cy="48" rx="15" ry="12" ${nucleus}/><circle cx="30" cy="62" r="6" fill="var(--muted)" fill-opacity=".5"/><circle cx="70" cy="66" r="5" fill="var(--muted)" fill-opacity=".5"/></svg>`,
  dc:`<svg viewBox="0 0 100 100"><path d="M50 22 L58 4 L62 26 L84 14 L72 36 L96 44 L72 54 L90 74 L64 66 L60 92 L50 70 L36 94 L36 66 L10 78 L28 56 L4 46 L28 38 L14 16 L38 28 Z" fill="url(#cyto)" stroke="var(--eosin)" stroke-opacity=".5" stroke-linejoin="round"/><circle cx="50" cy="48" r="13" ${nucleus}/></svg>`,
  eosinophil:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="var(--eosin)" fill-opacity=".25" stroke="var(--eosin)" stroke-opacity=".5"/>${Array.from({length:26},(_,i)=>{const a=i*2.4,r=12+((i*7)%22);return `<circle cx="${50+r*Math.cos(a)}" cy="${50+r*Math.sin(a)}" r="3.2" fill="var(--eosin)"/>`}).join('')}<circle cx="38" cy="46" r="11" ${nucleus}/><circle cx="62" cy="46" r="11" ${nucleus}/><path d="M38 46 L62 46" stroke="var(--hema)" stroke-width="3"/></svg>`,
  basophil:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="url(#cyto)" stroke="var(--eosin)" stroke-opacity=".5"/><path d="M34 38 C40 30 60 30 66 40 C70 52 60 62 50 58 C40 64 30 52 34 38Z" ${nucleus}/>${Array.from({length:22},(_,i)=>{const a=i*2.7,r=8+((i*5)%26);return `<circle cx="${50+r*Math.cos(a)}" cy="${50+r*Math.sin(a)}" r="3.6" fill="var(--hema)"/>`}).join('')}</svg>`,
  mast:`<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="44" ry="34" fill="url(#cyto)" stroke="var(--eosin)" stroke-opacity=".5"/>${Array.from({length:36},(_,i)=>{const a=i*2.4,r=6+((i*7)%28);return `<circle cx="${50+r*1.25*Math.cos(a)}" cy="${50+r*.9*Math.sin(a)}" r="3" fill="var(--hema)" fill-opacity=".8"/>`}).join('')}<circle cx="50" cy="50" r="11" ${nucleus}/></svg>`,
  nk:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="36" fill="url(#cyto)" stroke="var(--eosin)" stroke-opacity=".5"/><circle cx="46" cy="48" r="24" ${nucleus}/><circle cx="76" cy="40" r="3.5" fill="var(--eosin)"/><circle cx="78" cy="54" r="3.5" fill="var(--eosin)"/><circle cx="72" cy="66" r="3.5" fill="var(--eosin)"/></svg>`,
  ilc:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="url(#cyto)" stroke="var(--eosin)" stroke-opacity=".5"/><circle cx="50" cy="50" r="25" ${nucleus}/><text x="50" y="56" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="15" font-weight="600" fill="var(--bg)">1·2·3</text></svg>`,
  tcell:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="var(--hema-soft)" stroke="var(--hema)" stroke-opacity=".5"/><circle cx="50" cy="50" r="23" ${nucleus}/></svg>`
};

/* ---------- diagrams ---------- */
const HEB=/[\u0590-\u05FF]/;
const t=(x,y,s,c='',a='middle')=>{let st='';if(LANG==='he'){s=TR[s]||s;if(HEB.test(s)){st=' style="direction:rtl"';a=a==='start'?'end':a==='end'?'start':a;}}return `<text x="${x}" y="${y}" text-anchor="${a}"${c?` class="${c}"`:''}${st}>${s}</text>`};
const icon=(n,x,y,s=44)=>CELLSVG[n].replace('<svg viewBox="0 0 100 100">',`<svg x="${x-s/2}" y="${y-s/2}" width="${s}" height="${s}" viewBox="0 0 100 100">`);
const bact=(x,y,r=0,o=1)=>`<rect x="${x-11}" y="${y-5}" width="22" height="10" rx="5" fill="var(--good)" opacity="${o}" transform="rotate(${r} ${x} ${y})"/>`;
const arrow=(x1,y1,x2,y2,c='var(--muted)')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2" marker-end="url(#arw)"/>`;
const mhc1=(x,y,c)=>`<rect x="${x-3}" y="${y-16}" width="6" height="16" fill="var(--eosin)"/><path d="M${x-12} ${y-16}h24v-14h-6v8h-12v-8h-6z" fill="var(--eosin)"/><circle cx="${x-3}" cy="${y-25}" r="3.5" fill="${c}"/><circle cx="${x+3}" cy="${y-25}" r="3.5" fill="${c}"/>`;
const mhc2=(x,y,c)=>`<rect x="${x-7}" y="${y-16}" width="4" height="16" fill="var(--hema)"/><rect x="${x+3}" y="${y-16}" width="4" height="16" fill="var(--hema)"/><path d="M${x-12} ${y-16}h24v-14h-6v8h-12v-8h-6z" fill="var(--hema)"/><circle cx="${x-3}" cy="${y-25}" r="3.5" fill="${c}"/><circle cx="${x+3}" cy="${y-25}" r="3.5" fill="${c}"/>`;
const rshape=(k,x,y,c)=>({
  tri:`<path d="M${x} ${y-6}l6 11h-12z" fill="${c}"/>`,
  sq:`<rect x="${x-5}" y="${y-5}" width="10" height="10" fill="${c}"/>`,
  circ:`<circle cx="${x}" cy="${y}" r="5.5" fill="${c}"/>`,
  dia:`<path d="M${x} ${y-7}l6 7l-6 7l-6-7z" fill="${c}"/>`,
  bar:`<rect x="${x-2.5}" y="${y-7}" width="5" height="14" fill="${c}"/>`,
  hex:`<path d="M${x-6} ${y}l3-5h6l3 5l-3 5h-6z" fill="${c}"/>`
}[k]);
const rcell=(x,y,r,fill,stroke,kinds,c,sw=1)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`+
  [-125,-90,-55].map((a,i)=>{const R=a*Math.PI/180;return rshape(kinds[i%kinds.length],x+(r+6)*Math.cos(R),y+(r+6)*Math.sin(R),c)}).join('');
const callout=(px,py,lx,ly,side,h,sub)=>{const a=side==='l'?'end':'start',ex=side==='l'?lx+6:lx-6;
  return `<line x1="${px}" y1="${py}" x2="${ex}" y2="${ly-4}" stroke="var(--muted)" stroke-width="1"/><circle cx="${px}" cy="${py}" r="3.5" fill="var(--ink)"/>${t(lx,ly-4,h,'b',a)}${t(lx,ly+12,sub,'m',a)}`};

const FIG = {
 epitope:()=>`<svg class="wide" viewBox="0 0 640 250" role="img" aria-label="Antigen with epitopes, a receptor binding one epitope, and a peptide on MHC">
  <path d="M60 125C55 65 140 40 195 60C250 80 262 150 222 182C182 212 70 205 60 125Z" fill="var(--hema-soft)" stroke="var(--hema)"/>
  <circle cx="196" cy="60" r="11" fill="var(--eosin)"/><rect x="243" y="118" width="20" height="20" rx="3" fill="var(--good)"/><path d="M80 178l12-22l12 22z" fill="var(--hema)"/>
  ${t(160,125,'Antigen','h')}${t(160,143,'e.g. a bacterial protein','m')}${t(160,236,'each coloured bump is an epitope','m')}
  <line x1="300" y1="20" x2="300" y2="236" stroke="var(--line)"/>
  <ellipse cx="368" cy="58" rx="24" ry="15" fill="var(--hema-soft)" stroke="var(--hema)"/><ellipse cx="432" cy="58" rx="24" ry="15" fill="var(--hema-soft)" stroke="var(--hema)"/>
  <circle cx="370" cy="78" r="9" fill="var(--eosin)"/><circle cx="430" cy="78" r="9" fill="var(--eosin)"/>
  <path d="M400 190L400 140L373 94M400 140L427 94" stroke="var(--hema)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="500" y1="20" x2="500" y2="236" stroke="var(--line)"/>
  <rect x="562" y="158" width="16" height="36" fill="var(--eosin-soft)" stroke="var(--eosin)"/>
  <path d="M530 160L530 112L546 112L546 136L594 136L594 112L610 112L610 160Z" fill="var(--eosin-soft)" stroke="var(--eosin)"/>
  ${[552,561,570,579,588].map(x=>`<circle cx="${x}" cy="129" r="5" fill="var(--good)"/>`).join('')}
  <path d="M520 198H620" stroke="var(--muted)" stroke-width="3"/>

 </svg>`,

 mhc:()=>`<svg class="wide" viewBox="0 0 640 260" role="img" aria-label="MHC I on an infected body cell and MHC II on an antigen presenting cell">

 </svg>`,

  ${[55,120,185,250].map(x=>rcell(x,120,22,'var(--eosin-soft)','var(--eosin)',['tri','sq','circ'],'var(--eosin)')).join('')}

  ${['tri','sq','circ','dia','bar','hex'].map((k,i)=>rcell(345+i*48,120,18,'var(--hema-soft)',i===3?'var(--eosin)':'var(--hema)',[k],'var(--hema)',i===3?3:1)).join('')}

  ${t(489,228,'only the matching cell multiplies','m')}${t(489,245,'this takes 4–7 days the first time','m')}

 </svg>`,

 </svg>`,

 </svg>`},

 ln:`<span class="pill">secondary</span><h3>Lymph nodes (~600 in the body)</h3><ul class="clean"><li>Where innate and adaptive immunity meet</li><li>Filter lymph fluid; spread throughout the lymphatic system</li><li>Activate lymphocytes and start responses against antigens arriving in lymph</li><li>Also a site where B cells (and others) finish maturing</li></ul><figure class="fig">${FIG.ln()}<figcaption>Lymph flows in from the tissues, lymphocytes arrive from the blood, and the two meet in the node.</figcaption></figure>`,
 spleen:`<span class="pill">secondary</span><h3>Spleen</h3><p>Filters the <b>blood</b> (LNs filter lymph). Starts responses to blood-borne pathogens, recycles iron, stores immune cells.</p><div class="grid g2"><div class="callout"><b>White pulp</b>: T and B cell zones. Screens blood for antigens; DCs, T and B cells interact. Splenic APCs arrive as precursors via blood and present antigen trapped by marginal-zone macrophages.</div><div class="callout pink"><b>Red pulp</b>: macrophages + red blood cells. Removes old, damaged or abnormal RBCs and recycles iron from them.</div></div><figure class="fig">${FIG.spleen()}</figure>`,
 lymph:`<span class="pill">the system</span><h3>Lymphatic system</h3><p>A network of organs, nodes, ducts and vessels that moves lymph from tissues back to the bloodstream. <b>Lymph</b> forms when interstitial fluid is collected by lymph capillaries.</p><ul class="clean"><li>Returns excess interstitial fluid to blood</li><li>Absorbs fats and fat-soluble vitamins from the gut into circulation</li><li>Carries DCs and antigen from tissues to lymph nodes</li></ul>`
};

R.strategies = ()=>`
<section class="view">
  <div class="stack"><span class="eyebrow">Chapter 5 · slides 44–57</span><h2>Six strategies of the immune system</h2>
  <p class="lead">The last part of the lecture explained <i>why</i> there are two arms. Each strategy below is a trade-off.</p></div>

  <div class="card stack tl">
    <span class="eyebrow">Strategy 1</span><h3>Timing: a layered defence</h3>
    <p>Drag the slider to move through time after infection.</p>
    <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><span class="clock" id="clock">0 h</span><span id="clocknote" style="color:var(--muted)"></span></div>
    <label for="tslider" class="eyebrow">Hours since infection</label>
    <input type="range" id="tslider" min="0" max="100" value="0">
    <div class="layers" id="layers">
      <div class="layer"><span class="eyebrow">0 – 4 h</span><h4>Barriers and preformed effectors</h4><ul class="clean"><li>Skin, mucus, pH</li><li>Antimicrobial peptides, enzymes</li><li>Complement</li><li>Resident macrophages, mast cells</li></ul></div>
      <div class="layer"><span class="eyebrow">4 – 96 h</span><h4>Induced innate response</h4><ul class="clean"><li>Microbial patterns read by fixed receptors</li><li>Cytokines, chemokines, interferons</li><li>Recruit neutrophils, monocytes</li><li>Inflammation · NK cells</li></ul></div>
      <div class="layer"><span class="eyebrow">&gt; 96 h</span><h4>Adaptive response</h4><ul class="clean"><li>Antigen carried to lymph node</li><li>The few matching lymphocytes multiply</li><li>T cells, antibodies</li><li>Memory</li></ul></div>
    </div>
    <p>Each layer buys time for the next. <b>Most infections are stopped by the first two layers</b> before the adaptive response is needed.</p>
  </div>

  <div class="grid g2">
    <div class="card stack"><span class="eyebrow">Strategy 2</span><h3>Recognition: patterns vs precision</h3>
      <p><span class="pill inn">innate</span> ~100 germline receptors, fixed for life (KIRs on NK cells are the exception). They recognise patterns shared by whole classes of microbes and <b>essential</b> to them, so microbes cannot easily mutate them away. Every cell of a type has the same set, so all respond at once.</p>
      <p><span class="pill ada">adaptive</span> One unique receptor per lymphocyte, made during development (~10¹² possible). Fine precision: T cells see peptide on MHC; B cells see any epitope. Can recognise anything, including self, so the repertoire must be censored.</p></div>
    <div class="card stack"><span class="eyebrow">Strategy 3</span><h3>Diversity has a price: time</h3>
      <p>For any microbe, only a tiny fraction of lymphocytes carry a matching receptor. Those few must first be found by the antigen, then divide many times.</p>
      <p><b>Result:</b> adaptive effector cells appear only 4–7 days after first exposure. Meanwhile the innate response holds the line and tells the adaptive arm <i>what kind</i> of response to make.</p></div>
  </div>

  <div class="card stack chart">
    <span class="eyebrow">Strategy 4</span><h3>Memory</h3>
    <svg viewBox="0 0 640 260" role="img" aria-label="Schematic of primary and secondary adaptive responses">
      <line x1="60" y1="210" x2="620" y2="210" stroke="var(--line)"/><line x1="60" y1="20" x2="60" y2="210" stroke="var(--line)"/>
      ${[0,7,14,21,28,35,42,49,56].map(d=>`<text x="${60+d*10}" y="228" text-anchor="middle">${d}</text>`).join('')}
      <text x="340" y="250" text-anchor="middle">days</text>
      <text x="20" y="115" text-anchor="middle" transform="rotate(-90 20 115)">response size (schematic)</text>
      <line x1="60" y1="20" x2="60" y2="210" stroke="var(--eosin)" stroke-dasharray="3 4"/>
      <line x1="340" y1="20" x2="340" y2="210" stroke="var(--eosin)" stroke-dasharray="3 4"/>
      <text x="66" y="32" style="fill:var(--eosin)">1st exposure</text><text x="346" y="32" style="fill:var(--eosin)">2nd exposure (same antigen)</text>
      <path d="M60 208 L110 207 C130 200 150 150 175 150 C200 150 215 190 260 200 L340 200" fill="none" stroke="var(--hema)" stroke-width="3"/>
      <path d="M340 200 L360 198 C375 150 395 45 425 45 C460 45 500 120 620 160" fill="none" stroke="var(--hema)" stroke-width="3"/>
      <rect x="62" y="186" width="50" height="16" fill="var(--sunk)"/><text x="87" y="198" text-anchor="middle">lag 4–7 d</text>
      <rect x="342" y="186" width="44" height="16" fill="var(--sunk)"/><text x="364" y="198" text-anchor="middle">1–3 d</text>
      <text x="175" y="140" text-anchor="middle">modest</text><text x="620" y="192" text-anchor="end">faster, larger, better adapted</text>
    </svg>
    <p>After the first response, most expanded cells die; a small long-lived population stays as <b>memory cells</b>. On second exposure more cells already match and they activate more easily, sometimes giving lifelong immunity. <b>Innate immunity has no antigen-specific memory</b>: the second infection meets the same receptors as the first.</p>
  </div>

  <div class="grid g2">
    <div class="card stack"><span class="eyebrow">Strategy 5</span><h3>Self vs non-self</h3>
      <p><span class="pill inn">innate: built in</span></p><ul class="clean"><li>Receptors bind structures we don't have (bacterial cell wall, viral dsRNA)</li><li>Compartment as filter: nucleic-acid sensors sit where our own DNA/RNA should never be</li><li>Missing self: NK cells kill cells lacking normal surface molecules</li><li>Host surfaces carry regulators that microbes lack</li></ul>
      <p><span class="pill ada">adaptive: learned</span></p><ul class="clean"><li>Random receptors will inevitably include self-reactive ones</li><li>Strong self-binders are removed during development</li><li>Escapees are suppressed (e.g. Tregs, lecture 12)</li><li>Failure = autoimmunity</li></ul></div>
    <div class="card stack"><span class="eyebrow">Strategy 6</span><h3>Cooperation: the hand-off</h3>
      <p><b>The innate arm detects, the adaptive arm directs, both execute.</b></p>
      <div class="flow" style="flex-direction:column">
        <div class="node"><b>Infection or damage</b></div><div class="arrow" style="transform:none">↓ danger detected</div>
        <div class="node"><b>Dendritic cell</b> senses microbe, takes antigen to lymph node</div><div class="arrow" style="transform:none">↓ antigen presented</div>
        <div class="node"><b>T cells</b> read it, then help or kill</div><div class="arrow" style="transform:none">↓ help</div>
        <div class="node"><b>B cells</b> make antibodies</div>
      </div>
      <p>The adaptive arm reuses innate effectors: antibodies trigger complement and phagocytes.</p></div>
  </div>

  <figure class="fig">${FIG.coop()}<figcaption>Strategy 6 as a picture: the innate arm detects (DC), the adaptive arm directs (T cells) and both execute (antibodies, effector cells, phagocytes).</figcaption></figure>

  <div class="grid g2">
    <div class="card stack"><h3>Vaccination: the strategy put to work</h3><ul class="clean"><li>A first exposure without the disease, so the real pathogen meets a second-exposure response</li><li>Only possible because the adaptive arm has specificity and memory</li><li>Also needs the innate arm: a vaccine must look like an infection (adjuvants) or it is ignored</li><li>Smallpox eradicated 1980; polio nearly. Herd immunity protects those who cannot respond</li></ul></div>
    <div class="card stack"><h3>When the system fails</h3>
      <div class="facts" style="grid-template-columns:auto 1fr">
        <dt>Too little</dt><dd><b>Immunodeficiency</b>: inherited (missing cells/proteins) or acquired (HIV, chemo, immunosuppressants)</dd>
        <dt>Against self</dt><dd><b>Autoimmunity</b>: type 1 diabetes, MS, lupus, rheumatoid arthritis</dd>
        <dt>Too much</dt><dd><b>Hypersensitivity</b>: allergy, contact dermatitis, chronic inflammation</dd>
        <dt>Unwanted</dt><dd><b>Rejection / GVHD</b>: a normal response against a transplant we want to keep</dd>
        <dt>Escape</dt><dd><b>Cancer</b>: transformed self that escaped surveillance (lecture 13)</dd>
      </div></div>
  </div>
  ${nextBar(5)}
</section>`;

    box.querySelectorAll('.qopts button').forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});

      <p><span class="pill ada">נרכשת: נלמד</span></p><ul class="clean"><li>קולטנים אקראיים יכללו בהכרח גם קולטנים שמגיבים לעצמי</li><li>תאים שנקשרים חזק לעצמי מסולקים בזמן ההתפתחות</li><li>מי שחומק מדוכא (למשל על ידי Tregs, הרצאה 12)</li><li>כשל של המנגנונים האלה = אוטואימוניות</li></ul></div>
    <div class="card stack"><span class="eyebrow">אסטרטגיה 6</span><h3>שיתוף פעולה: העברת המקל</h3>
      <p><b>הזרוע המולדת מזהה, הזרוע הנרכשת מכוונת, ושתיהן מבצעות.</b></p>
      <div class="flow" style="flex-direction:column">
        <div class="node"><b>זיהום או נזק</b></div><div class="arrow" style="transform:none">↓ זוהתה סכנה</div>
        <div class="node"><b>תא דנדריטי</b> חש את המיקרואורגניזם ולוקח אנטיגן לבלוטת הלימפה</div><div class="arrow" style="transform:none">↓ האנטיגן מוצג</div>
        <div class="node"><b>תאי T</b> קוראים אותו, ואז מסייעים או הורגים</div><div class="arrow" style="transform:none">↓ סיוע</div>
        <div class="node"><b>תאי B</b> מייצרים נוגדנים</div>
      </div>
      <p>הזרוע הנרכשת משתמשת שוב באפקטורים מולדים: נוגדנים מפעילים את המשלים ואת הפגוציטים.</p></div>
  </div>
  <figure class="fig">${FIG.coop()}<figcaption>אסטרטגיה 6 בתמונה: הזרוע המולדת מזהה (DC), הזרוע הנרכשת מכוונת (תאי T), ושתיהן מבצעות (נוגדנים, תאי אפקטור, פגוציטים).</figcaption></figure>
  <div class="grid g2">
    <div class="card stack"><h3>חיסונים: האסטרטגיה בפעולה</h3><ul class="clean"><li>חשיפה ראשונה בלי המחלה, כך שהפתוגן האמיתי פוגש תגובה של חשיפה שנייה</li><li>אפשרי רק כי לזרוע הנרכשת יש ספציפיות וזיכרון</li><li>צריך גם את הזרוע המולדת: החיסון חייב להיראות כמו זיהום (אדג׳ובנטים), אחרת מתעלמים ממנו</li><li>האבעבועות השחורות הוכחדו ב-1980 ופוליו כמעט. חסינות עדר מגינה על מי שלא יכול להגיב בעצמו</li></ul></div>
    <div class="card stack"><h3>כשהמערכת נכשלת</h3>
      <div class="facts" style="grid-template-columns:auto 1fr">
        <dt>מעט מדי</dt><dd><b>כשל חיסוני</b>: תורשתי (חסרים תאים או חלבונים) או נרכש (HIV, כימותרפיה, תרופות מדכאות חיסון)</dd>
        <dt>נגד העצמי</dt><dd><b>אוטואימוניות</b>: סוכרת מסוג 1, טרשת נפוצה, זאבת, דלקת מפרקים שגרונתית</dd>
        <dt>יותר מדי</dt><dd><b>רגישות יתר</b>: אלרגיה, דלקת עור ממגע, דלקת כרונית</dd>
        <dt>לא רצוי</dt><dd><b>דחייה / GVHD</b>: תגובה תקינה נגד שתל שאנחנו רוצים לשמור</dd>
        <dt>בריחה</dt><dd><b>סרטן</b>: עצמי שעבר התמרה וחמק מהמעקב החיסוני (הרצאה 13)</dd>

  </div>

</section>`;

    <div class="card stack"><span class="pill">${L('sense and communicate','לחוש ולתקשר')}</span><h3>MHC</h3><p>${L('MHC I on all nucleated cells and MHC II on antigen presenting cells show the immune system what is inside and around them (lecture 1).','MHC I על כל התאים בעלי גרעין ו-MHC II על תאים מציגי אנטיגן מראים למערכת החיסון מה יש בתוכם ובסביבתם (הרצאה 1).')}</p></div>
    <div class="card stack"><span class="pill inn">${L('sense and defend','לחוש ולהגן')}</span><h3>PAMPs</h3><p>${L('Pathogen-associated molecular patterns. They are sensed by most nucleated cells, not only by immune cells.','תבניות מולקולריות שקשורות לפתוגנים (PAMP). רוב התאים בעלי גרעין חשים אותן, לא רק תאי חיסון.')}</p></div>
  </div>
  <div class="callout"><b>${L('Why patterns?','למה דווקא תבניות?')}</b> ${L('Microbes evolve fast, so innate immunity targets highly conserved, essential parts such as cell wall structures and nucleic acids, which a microbe cannot change without harming itself. The receptors are germline-encoded: no rearrangement, no clonal selection, no memory, and no prior exposure is needed.','מיקרואורגניזמים מתפתחים מהר, ולכן החסינות המולדת מכוונת לחלקים שמורים וחיוניים, כמו מבני דופן התא וחומצות גרעין, שהמיקרואורגניזם לא יכול לשנות בלי לפגוע בעצמו. הקולטנים מקודדים בדנ״א התורשתי: אין שחלוף גנים, אין ברירה שבטית, אין זיכרון, ולא צריך חשיפה מוקדמת.')}</div>
  <div class="callout pink">${L('Non-immune cells, such as epithelial cells, also sense PAMPs. They respond by making cytokines and chemokines that recruit immune cells, so they take part in innate immunity too.','גם תאים שאינם תאי חיסון, כמו תאי אפיתל, חשים PAMP. הם מגיבים בייצור ציטוקינים וכמוקינים שמגייסים תאי חיסון, ולכן גם הם משתתפים בחסינות המולדת.')}</div>
  <div class="grid g2">
    <div class="card stack"><span class="pill inn">PAMP</span><h3>${L('Pathogen-associated patterns','תבניות של פתוגנים')}</h3><p>${L('Molecules that belong to microbes: lipopolysaccharide, flagellin, peptidoglycan, viral RNA, unmethylated CpG DNA.','מולקולות ששייכות למיקרואורגניזמים: ליפופוליסכריד, פלגלין, פפטידוגליקן, RNA נגיפי, DNA מסוג CpG לא ממותל.')}</p></div>
    <div class="card stack"><span class="pill">DAMP</span><h3>${L('Damage (danger)-associated patterns','תבניות של נזק (סכנה)')}</h3><p>${L('Molecules released from our own damaged or dying cells: ATP outside the cell, advanced glycation end-products, crystals, DNA outside the nucleus. They cause <b>sterile inflammation</b>: inflammation without any microbe, for example after an injury.','מולקולות שמשתחררות מתאים פגועים או מתים שלנו: ATP מחוץ לתא, תוצרים סופיים של גליקציה, גבישים, DNA מחוץ לגרעין. הן גורמות ל<b>דלקת סטרילית</b>: דלקת בלי שום מיקרואורגניזם, למשל אחרי פציעה.')}</p></div>
  </div>

  </div>
  ${fig(FIG2.phago(),L('The route of swallowed material. Each step is more acidic. Endosomal TLRs inspect the contents on the way, and at the end protein fragments are loaded onto MHC II.','המסלול של חומר שנבלע. כל שלב חומצי יותר. ה-TLR באנדוזום בודקים את התוכן בדרך, ובסוף קטעי חלבון נטענים על MHC II.'))}
  <div class="stack"><h3>${L('The receptor families (PRRs)','משפחות הקולטנים (PRR)')}</h3>
  ${tbl([L('Family','משפחה'),L('Where','איפה'),L('What it recognises','מה הוא מזהה')],[
   [L('Toll-like receptors (TLRs)','קולטנים דמויי Toll (TLR)'),L('cell surface and endosome','פני התא ואנדוזום'),L('lipopolysaccharide, flagellin, unmethylated CpG DNA, viral RNA','ליפופוליסכריד, פלגלין, DNA מסוג CpG לא ממותל, RNA נגיפי')],
   [L('C-type lectin receptors (CLRs)','קולטני לקטין מסוג C (CLR)'),L('cell surface','פני התא'),L('sugar structures on pathogens','מבני סוכר על פני פתוגנים')],
   [L('RIG-I-like receptors (RLRs)','קולטנים דמויי RIG-I (RLR)'),L('cytoplasm','ציטופלסמה'),L('viral RNA','RNA נגיפי')],
   [L('NOD-like receptors (NLRs)','קולטנים דמויי NOD (NLR)'),L('cytoplasm','ציטופלסמה'),L('fragments of bacterial peptidoglycan','קטעים של פפטידוגליקן חיידקי')],
   [L('AIM2-like receptors (ALRs)','קולטנים דמויי AIM2 (ALR)'),L('cytoplasm','ציטופלסמה'),L('DNA in the cytoplasm','DNA בציטופלסמה')],
   ['RAGE',L('cell surface','פני התא'),L('advanced glycation end-products','תוצרים סופיים של גליקציה')],
   [L('Purinergic receptors (PR)','קולטנים פורינרגיים (PR)'),L('cell surface','פני התא'),L('ATP outside the cell, released by damaged or necrotic cells','ATP מחוץ לתא, שמשתחרר מתאים פגועים או נמקיים')]])}</div>
  <details class="reveal"><summary>${L('Proof from patients','ההוכחה מחולים')}</summary><ul class="clean">
    <li>${L('IRAK4 or MyD88 deficiency: severe bacterial infections with pus in childhood.','חסר ב-IRAK4 או ב-MyD88: זיהומים חיידקיים קשים עם מוגלה בילדות.')}</li>
    <li>${L('A broken TLR3 pathway: herpes simplex infection of the brain.','מסלול TLR3 פגום: זיהום של הרפס סימפלקס במוח.')}</li>
    <li>${L('An overactive TLR7: lupus.','TLR7 פעיל מדי: זאבת.')}</li></ul></details>
  ${nb2(2)}
</section>`;

  <p class="lead">${L('One receptor binding one molecule is a tiny event. The cell turns it into a loud, specific message: first inside the cell, then to other cells with cytokines.','קולטן אחד שקושר מולקולה אחת הוא אירוע זעיר. התא הופך אותו להודעה חזקה וספציפית: קודם בתוך התא, ואז לתאים אחרים בעזרת ציטוקינים.')}</p></div>

   [L('Type I','סוג I'),'IFN-α, IFN-β, IFN-ε, IFN-κ, IFN-ω',L('almost every cell type, usually in response to viruses','כמעט כל סוגי התאים, בדרך כלל בתגובה לנגיפים'),L('switch on antiviral defences in many cell types','מפעילים הגנות אנטי-ויראליות בסוגי תאים רבים')],
   [L('Type II','סוג II'),L('IFN-γ only','IFN-γ בלבד'),L('NK cells and T cells','תאי NK ותאי T'),L('activates macrophages and phagocytosis, drives Th1 cells, raises MHC I and MHC II so antigen presentation gets stronger','משפעל מקרופאג׳ים ופגוציטוזה, מכוון לתאי Th1, מעלה את MHC I ו-MHC II כך שהצגת האנטיגן מתחזקת')],

 il:()=>`<p>${L('Interleukins regulate how immune cells talk to each other and coordinate.','אינטרלוקינים מווסתים את התקשורת והתיאום בין תאי החיסון.')}</p><div class="grid g2"><div class="callout pink"><b>${L('Pro-inflammatory','מעוררי דלקת')}</b>: IL-1, IL-6. ${L('Start and spread inflammation.','מתחילים ומפיצים את הדלקת.')}</div><div class="callout"><b>${L('Anti-inflammatory','נוגדי דלקת')}</b>: IL-10, TGF-β. ${L('Regulate and resolve inflammation.','מווסתים ומסיימים את הדלקת.')}</div></div>`,

R2['l2-resolution']=()=>`
<section class="view">
  <div class="stack"><span class="eyebrow">${L('Chapter 4 · slides 24–26','פרק 4 · שקופיות 24–26')}</span><h2>${L('Switching off and healing','כיבוי וריפוי')}</h2>
  <p class="lead">${L('Resolution is an active programme, not just the absence of a stimulus. It has its own signals, and those signals can fail.','סיום התגובה הוא תוכנית פעילה, לא רק היעדר גירוי. יש לו אותות משלו, והאותות האלה יכולים להיכשל.')}</p></div>
  ${fig(FIG2.resolve(),L('Neutrophils arrive first and die within a day or two. Macrophages that eat them switch to cleaning up, and the response ends. If the trigger stays, the response never ends and becomes chronic.','נויטרופילים מגיעים ראשונים ומתים תוך יום-יומיים. מקרופאג׳ים שבולעים אותם עוברים לניקוי, והתגובה נגמרת. אם הגורם נשאר, התגובה לא נגמרת והופכת לכרונית.'))}
  <div class="stack"><h3>${L('How the response ends','איך התגובה נגמרת')}</h3>
  <ol class="steps-list">${[[`The trigger disappears`,`הגורם נעלם`,`The pathogen is cleared, the sensors stop signalling, and cytokines only last minutes to hours.`,`הפתוגן מסולק, החיישנים מפסיקים לאותת, וציטוקינים שורדים רק דקות עד שעות.`],
   [`Neutrophils die`,`הנויטרופילים מתים`,`Macrophages eat them, and eating dead neutrophils switches the macrophage to its resolving programme.`,`מקרופאג׳ים בולעים אותם, והבליעה של נויטרופילים מתים מעבירה את המקרופאג׳ לתוכנית הסיום שלו.`],
   [`The signals switch`,`האותות מתחלפים`,`Cells at the site stop making the molecules that attract neutrophils and start making molecules that keep neutrophils out and encourage macrophages to clean up.`,`התאים באתר מפסיקים לייצר את המולקולות שמושכות נויטרופילים ומתחילים לייצר מולקולות שמרחיקות נויטרופילים ומעודדות את המקרופאג׳ים לנקות.`],
   [`Brakes are applied`,`מפעילים בלמים`,`Active blockers. The IL-1 receptor antagonist sits in the IL-1 receptor without activating it, so IL-1 can no longer act. IL-10 and TGF-β stop cytokine production.`,`חוסמים פעילים. אנטגוניסט הקולטן ל-IL-1 יושב בקולטן בלי להפעיל אותו, כך ש-IL-1 כבר לא יכול לפעול. IL-10 ו-TGF-β עוצרים את ייצור הציטוקינים.`],
   [`If it fails`,`אם זה נכשל`,`If the trigger does not go away, for example a foreign body or a self molecule, inflammation becomes chronic, the tissue scars and loses its function.`,`אם הגורם לא נעלם, למשל גוף זר או מולקולה עצמית, הדלקת הופכת לכרונית, והרקמה מצטלקת ומאבדת את תפקודה.`]].map((s,i)=>`<li class="${i===4?'fail':''}"><b>${L(s[0],s[1])}</b><span>${L(s[2],s[3])}</span></li>`).join('')}</ol></div>
  <div class="grid g2">
    <div class="card stack"><span class="pill">${L('cellular','תאי')}</span><h3>${L('Myeloid-derived suppressor cells (MDSCs)','תאים מדכאים ממקור מיאלואידי (MDSC)')}</h3><p>${L('Granulocyte-like cells that the local environment shapes into suppressors of the immune response.','תאים דמויי גרנולוציטים שהסביבה המקומית מעצבת לתאים שמדכאים את התגובה החיסונית.')}</p></div>
    <div class="card stack"><span class="pill">${L('humoral','הומורלי')}</span><h3>IL-10 · TGF-β</h3><p>${L('Cytokines that start resolution and suppress the other inflammatory cytokines.','ציטוקינים שמתחילים את סיום התגובה ומדכאים את שאר הציטוקינים הדלקתיים.')}</p></div>
  </div>
  <div class="card stack"><h3>${L('Tissue repair, and how it turns into fibrosis','תיקון הרקמה, ואיך הוא הופך לפיברוזיס')}</h3>
    <div class="flow">
      <div class="node"><span class="eyebrow">${L('signal','אות')}</span><p><b>IL-13 · IL-33</b></p></div><div class="arrow">${L('→','←')}</div>
      <div class="node"><span class="eyebrow">${L('growth factor','פקטור גדילה')}</span><p><b>AREG</b> (${L('amphiregulin','אמפירגולין')})</p></div><div class="arrow">${L('→','←')}</div>
      <div class="node"><span class="eyebrow">${L('receptor','קולטן')}</span><p><b>EGFR</b></p></div><div class="arrow">${L('→','←')}</div>
      <div class="node"><span class="eyebrow">${L('normal result','תוצאה רגילה')}</span><p>${L('the tissue grows back and is repaired','הרקמה גדלה מחדש ומתוקנת')}</p></div>
    </div>
    <div class="callout pink">${L('When AREG–EGFR signalling never stops, as in chronic inflammation, it leads to collagen production and extracellular matrix deposits. This damages the tissue and can end in fibrosis.','כשהאיתות של AREG–EGFR לא נעצר, כמו בדלקת כרונית, הוא מוביל לייצור קולגן ולשקיעה של מטריקס חוץ-תאי. זה פוגע ברקמה ויכול להסתיים בפיברוזיס.')}</div>
    <p>${L('The same repair programme can be hijacked by a tumour to protect itself (lecture 13).','גידול יכול לחטוף את אותה תוכנית תיקון כדי להגן על עצמו (הרצאה 13).')}</p>
  </div>
  ${nb2(4)}
</section>`;

<section class="view">
  <div class="stack"><span class="eyebrow">${L('Chapter 5 · slides 27–36','פרק 5 · שקופיות 27–36')}</span><h2>${L('Killing mechanisms','מנגנוני הרג')}</h2>
  <p class="lead">${L('Innate immunity ends a threat in three ways: by making cells die, by antibody-guided killing (ADCC), and with complement (CDC, next week).','החסינות המולדת מסיימת איום בשלוש דרכים: בגרימת מוות של תאים, בהרג שמכוון על ידי נוגדנים (ADCC), ובעזרת המשלים (CDC, בשבוע הבא).')}</p></div>
  ${fig(FIG2.death())}
  <div class="stack"><h3>${L('Five ways to die','חמש דרכים למות')}</h3>
    ${seg('deathseg',[['all',L('All','הכול')],['0',L('Contained','שקט')],['1',L('Inflammatory','דלקתי')]])}
    <div class="grid g3" id="deathgrid">${DEATHS.map(d=>`<div class="card stack death" data-inf="${d[2]}"><span class="pill ${d[2]?'inn':'live'}">${d[2]?L('inflammatory','דלקתי'):L('contained','שקט')}</span><h3>${L(d[0],d[1])}</h3><p>${L(d[3],d[4])}</p></div>`).join('')}</div></div>
  <div class="card stack"><h3>${L('Apoptosis: programmed cell death','אפופטוזיס: מוות תאי מתוכנת')}</h3>
    ${fig(FIG2.apop())}
    <ul class="clean">
      <li>${L('<b>Caspases</b> are cysteine proteases that cut proteins right after aspartic acid. <b>Initiator</b> caspases (8, 9) cut and activate other caspases; <b>effector</b> caspases (3, 7) cut hundreds of normal proteins: the cytoskeleton, DNA repair enzymes, nuclear lamins, transcription factors. The cell is taken apart in an orderly way, without inflammation.','<b>קספאזות</b> הן פרוטאזות ציסטאין שחותכות חלבונים מיד אחרי חומצה אספרטית. קספאזות <b>מתחילות</b> (8, 9) חותכות ומשפעלות קספאזות אחרות; קספאזות <b>מבצעות</b> (3, 7) חותכות מאות חלבונים רגילים: שלד התא, אנזימים לתיקון DNA, למינים של הגרעין, פקטורי שעתוק. התא מפורק בצורה מסודרת, בלי דלקת.')}</li>
      <li>${L('Apoptosis is tightly controlled by the <b>Bcl-2 family</b> and by inhibitor of apoptosis proteins (IAPs).','האפופטוזיס מבוקר בקפדנות על ידי <b>משפחת Bcl-2</b> ועל ידי חלבונים מעכבי אפופטוזיס (IAP).')}</li>
      <li>${L('NK cells and cytotoxic T cells make their targets undergo apoptosis. Neutrophils and macrophages kill the pathogens they swallow. Dendritic cells and mast cells act indirectly, through the mediators they release.','תאי NK ותאי T ציטוטוקסיים גורמים למטרות שלהם לעבור אפופטוזיס. נויטרופילים ומקרופאג׳ים הורגים את הפתוגנים שהם בולעים. תאים דנדריטיים ותאי פיטום פועלים בעקיפין, דרך המתווכים שהם משחררים.')}</li>
    </ul>
    ${tbl([L('Bcl-2 group','קבוצה במשפחת Bcl-2'),L('Members','חברים'),L('Role','תפקיד')],[
     [L('Anti-apoptotic','נוגדי אפופטוזיס'),'Bcl-2, Bcl-XL, Mcl-1',L('block apoptosis','חוסמים אפופטוזיס')],
     [L('Pro-apoptotic effectors','מבצעים מעודדי אפופטוזיס'),'Bax, Bak',L('punch pores in the outer membrane of the mitochondria','מנקבים את הממברנה החיצונית של המיטוכונדריה')],
     [L('BH3-only sensors','חיישני BH3 בלבד'),'Bid, Bim, Puma, Noxa, Bad',L('sense stress and activate Bax and Bak','חשים עקה ומשפעלים את Bax ו-Bak')]])}
  </div>
  <div class="card stack"><h3>${L('The inflammasome: how a damaged cell triggers pyroptosis','האינפלמזום: איך תא פגוע מפעיל פירופטוזיס')}</h3>
    <div class="steps" id="infsteps" role="group">${INFL.map((s,i)=>`<button aria-pressed="${i===0}" data-s="${i+1}">${i+1} · ${L(s[0],s[1])}</button>`).join('')}</div>
    <div id="inffig"></div><p id="inftext" aria-live="polite"></p>
    <h4>${L('Two signals are needed','צריך שני אותות')}</h4>
    <div class="grid g2">
      <div class="callout"><b>${L('Signal 1: make the precursor','אות 1: לייצר את חומר המוצא')}</b><br>${L('A TLR recognises a pathogen molecule. This activates NF-κB, which makes inactive pro-IL-1β.','TLR מזהה מולקולה של פתוגן. זה משפעל את NF-κB, שמייצר pro-IL-1β לא פעיל.')}</div>
      <div class="callout pink"><b>${L('Signal 2: activate the inflammasome','אות 2: לשפעל את האינפלמזום')}</b><br>${L('A second stimulus, such as cell stress, activates a sensor inside the cell. The inflammasome assembles, caspase-1 becomes active and turns pro-IL-1β into mature IL-1β, which is released.','גירוי שני, כמו עקה בתא, משפעל חיישן בתוך התא. האינפלמזום מתרכב, קספאז-1 הופך לפעיל והופך את pro-IL-1β ל-IL-1β בוגר שמשתחרר.')}</div>
    </div>
  </div>
  <div class="card stack"><h3>${L('Clearing the dead: efferocytosis','פינוי המתים: אפרוציטוזיס')}</h3>
    <p>${L('About 10¹¹ cells die by apoptosis every day, and macrophages eat them before they leak.','כ-10¹¹ תאים מתים באפופטוזיס בכל יום, ומקרופאג׳ים בולעים אותם לפני שהם דולפים.')}</p>
    ${fig(FIG2.effero())}
    <ul class="clean">
      <li>${L('<b>Find-me</b>: a dying cell releases small molecules, ATP among them, that attract macrophages.','<b>מצא-אותי</b>: תא גוסס משחרר מולקולות קטנות, ביניהן ATP, שמושכות מקרופאג׳ים.')}</li>
      <li>${L('<b>Eat-me</b>: phosphatidylserine, a lipid normally kept on the inner face of the membrane, appears on the outside of a dying cell, and macrophage receptors recognise it.','<b>אכול-אותי</b>: פוספטידילסרין, ליפיד שבדרך כלל נמצא בצד הפנימי של הממברנה, מופיע בצד החיצוני של תא גוסס, וקולטנים של המקרופאג׳ מזהים אותו.')}</li>
      <li>${L('<b>Don\'t-eat-me</b>: healthy cells display CD47, which tells the macrophage not to eat them. Tumour cells use the same signal to avoid being eaten.','<b>אל-תאכל-אותי</b>: תאים בריאים מציגים CD47, שאומר למקרופאג׳ לא לבלוע אותם. תאי גידול משתמשים באותו אות כדי לא להיבלע.')}</li>
    </ul></div>
  <div class="card stack"><h3>${L('ADCC: antibody-dependent cellular cytotoxicity','ADCC: ציטוטוקסיות תאית תלוית נוגדנים')}</h3>
    ${fig(FIG2.adcc(),L('Antibodies bind the target with their arms and leave their tail (Fc) sticking out. Immune cells with Fc receptors grab the tail and kill the target or swallow it.','נוגדנים נקשרים למטרה בזרועות שלהם ומשאירים את הזנב (Fc) בחוץ. תאי חיסון עם קולטני Fc נאחזים בזנב והורגים את המטרה או בולעים אותה.'))}
    ${tbl([L('Cell','תא'),L('Fc receptors','קולטני Fc'),L('How it contributes','איך הוא תורם')],[
     [L('NK cells','תאי NK'),'CD16 (FcγRIII)',L('release perforin and granzymes','משחררים פרפורין וגרנזימים')],
     [L('Macrophages, monocytes','מקרופאג׳ים, מונוציטים'),'CD16, CD64 (FcγRI), CD32a (FcγRIIa)',L('phagocytosis and cytokine release','פגוציטוזה ושחרור ציטוקינים')],
     [L('Neutrophils','נויטרופילים'),'CD32a, CD16',L('phagocytosis and ROS production','פגוציטוזה וייצור ROS')],
     [L('Eosinophils','אאוזינופילים'),L('FcεRI (high-affinity IgE receptor)','FcεRI (קולטן בעל זיקה גבוהה ל-IgE)'),L('in specific cases, such as parasite infections','במקרים מסוימים, כמו זיהומים בטפילים')]])}
  </div>
  ${nb2(5)}
</section>`;

R2['l2-decision']=()=>`
<section class="view">

  <p class="lead">${L('Killers must not kill healthy cells. T cells and NK cells use two different logics to decide, and together they cover each other\'s blind spots.','רוצחים לא אמורים להרוג תאים בריאים. תאי T ותאי NK משתמשים בשתי לוגיקות שונות כדי להחליט, ויחד הם מכסים את הנקודות העיוורות זה של זה.')}</p></div>
  <div class="card stack"><span class="pill ada">${L('T cells','תאי T')}</span><h3>${L('T cells read peptides on MHC','תאי T קוראים פפטידים על MHC')}</h3><ul class="clean">

    <div class="filters" id="nkpre" role="group">${[['healthy',L('Healthy cell','תא בריא')],['hide',L('Virus removed MHC I','נגיף סילק את MHC I')],['stress',L('Stressed tumour cell','תא גידול בעקה')],['ab',L('Antibody-coated cell','תא מצופה בנוגדנים')]].map(([k,l],i)=>`<button aria-pressed="${i===0}" data-p="${k}">${l}</button>`).join('')}</div>

    ['DNAM-1 (CD226)',L('PVR and nectin-2, adhesion molecules raised on infected and tumour cells','PVR ו-nectin-2, מולקולות היצמדות שעולות על תאים נגועים ותאי גידול'),L('activating','משפעל')],
    ['CD16 (FcγRIIIa)',L('IgG bound to a cell','IgG שקשור לתא'),L('activating','משפעל')]])}
  <details class="reveal"><summary>${L('Extra: education and the arms race','הרחבה: חינוך ומרוץ חימוש')}</summary><ul class="clean">
    <li>${L('An NK cell becomes fully active only if its inhibitory receptors met self MHC during development (education, or licensing). This stops NK cells that cannot be inhibited from attacking the body.','תא NK הופך לפעיל לגמרי רק אם הקולטנים המעכבים שלו פגשו MHC עצמי בזמן ההתפתחות (חינוך, או licensing). כך תאי NK שאי אפשר לעכב לא תוקפים את הגוף.')}</li>

/* ---------- behaviour ---------- */
function nkState(){const on=k=>$('#nk-'+k).checked;const inh=[],act=[NKITEMS.base];if(on('mhc'))inh.push(NKITEMS.mhc);['stress','ncr','ab'].forEach(k=>{if(on(k))act.push(NKITEMS[k])});
 const sum=a=>a.reduce((s,x)=>s+x.w,0);const I={w:sum(inh),items:inh.map(x=>({w:x.w,l:L(x.l[0],x.l[1])}))},A={w:sum(act),items:act.map(x=>({w:x.w,l:L(x.l[0],x.l[1])}))};
 $('#nkfig').innerHTML=fig(FIG2.nkbal(I,A));const kill=A.w>I.w;
 $('#nkverdict').className='verdict '+(kill?'kill':'spare');
 $('#nkverdict').innerHTML=`<b>${kill?L('Kill','להרוג'):L('Spare','לחוס')}</b> · ${L(`inhibitory ${I.w} vs activating ${A.w}`,`מעכבים ${I.w} מול משפעלים ${A.w}`)}. ${kill?(on('mhc')?L('Strong activating signals overcome the MHC I brake ("induced self").','אותות משפעלים חזקים גוברים על הבלם של MHC I ("עצמי מושרה").'):L('Without MHC I there is nothing to brake the NK cell ("missing self").','בלי MHC I אין מה שיבלום את תא ה-NK ("העצמי החסר").')):L('MHC I engages the inhibitory receptors and outweighs the activating signals.','MHC I מפעיל את הקולטנים המעכבים וגובר על האותות המשפעלים.')}`;}

const INIT2={
 'l2-inflammation'(){const show=k=>{segOn('signseg',k);document.querySelectorAll('.sg').forEach(g=>g.style.opacity=(k==='all'||g.dataset.s===k)?1:.15);
   $('#signtext').innerHTML=k==='all'?L('Pick a sign to see what produces it.','בחרו סימן כדי לראות מה גורם לו.'):`<b>${L(SIGNS[k][0],SIGNS[k][1])}.</b> ${L(SIGNS[k][2],SIGNS[k][3])}`;};
   $('#signseg').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.k)};show('all');},
 'l2-recognition'(){const show=k=>{segOn('prrseg',k);document.querySelectorAll('.comp').forEach(g=>g.classList.toggle('on',g.dataset.c===k));const p=PRR[k];
   $('#prrpanel').innerHTML=`<h3>${L(p.t[0],p.t[1])}</h3><p>${L(p.n[0],p.n[1])}</p>`+tbl([L('Receptor','קולטן'),L('Binds','קושר'),L('Comes from','מגיע מ')],p.r.map(r=>[`<span class="mono">${Array.isArray(r[0])?L(r[0][0],r[0][1]):r[0]}</span>`,L(r[1][0],r[1][1]),L(r[2][0],r[2][1])]));};
   $('#prrseg').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.k)};document.querySelectorAll('.comp').forEach(g=>g.addEventListener('click',()=>show(g.dataset.c)));show('surface');},
 'l2-signals'(){const show=k=>{segOn('tlrseg',k);$('#tlrfig').innerHTML=fig(FIG2.tlrsig(k));$('#tlrtext').textContent=L(TLRTXT[k][0],TLRTXT[k][1]);};
   $('#tlrseg').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.k)};show('tlr2');
   const sc=k=>{segOn('cytseg',k);$('#cytbody').innerHTML=CYT[k]();};$('#cytseg').onclick=e=>{const b=e.target.closest('button');if(b)sc(b.dataset.k)};sc('ifn');},
 'l2-killing'(){$('#deathseg').onclick=e=>{const b=e.target.closest('button');if(!b)return;segOn('deathseg',b.dataset.k);document.querySelectorAll('.death').forEach(d=>d.hidden=!(b.dataset.k==='all'||d.dataset.inf===b.dataset.k));};
   const ss=n=>{document.querySelectorAll('#infsteps button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.s===n));$('#inffig').innerHTML=fig(FIG2.inflammasome(n));const s=INFL[n-1];$('#inftext').innerHTML=`<b>${L(s[0],s[1])}.</b> ${L(s[2],s[3])}`;};
   $('#infsteps').onclick=e=>{const b=e.target.closest('button');if(b)ss(+b.dataset.s)};ss(1);},
 'l2-decision'(){const P={healthy:{mhc:1},hide:{},stress:{mhc:1,stress:1,ncr:1},ab:{mhc:1,ab:1}};
   const preset=k=>{document.querySelectorAll('#nkpre button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===k));['mhc','stress','ncr','ab'].forEach(x=>$('#nk-'+x).checked=!!P[k][x]);nkState();};
   $('#nkpre').onclick=e=>{const b=e.target.closest('button');if(b)preset(b.dataset.p)};
   document.querySelectorAll('.nkchecks input').forEach(i=>i.onchange=()=>{document.querySelectorAll('#nkpre button').forEach(b=>b.setAttribute('aria-pressed','false'));nkState();});preset('healthy');},
 'l2-quiz'(){QZ=l2quiz();QKEY='imm2-best';quizStart();},
 'l2-cards'(){GL=l2gloss();FC=GL.map((_,i)=>i);fi=0;fcInit();}
};

const L2QUIZ=[
 {q:[`Which of these is NOT one of the four classic signs of inflammation?`,`איזה מהבאים אינו אחד מארבעת הסימנים הקלאסיים של דלקת?`],o:[[`Redness`,`אדמומיות`],[`Heat`,`חום`],[`Pain`,`כאב`],[`Itching`,`גרד`]],a:3,e:[`The four signs are redness, swelling, heat and pain. Loss of function was added later by Virchow.`,`ארבעת הסימנים הם אדמומיות, נפיחות, חום וכאב. אובדן תפקוד נוסף מאוחר יותר על ידי וירכוב.`]},
 {q:[`What causes the swelling in acute inflammation?`,`מה גורם לנפיחות בדלקת חריפה?`],o:[[`Cells in the tissue divide quickly`,`תאים ברקמה מתחלקים מהר`],[`Gaps between endothelial cells in post-capillary venules let plasma leak out`,`רווחים בין תאי האנדותל בוורידונים שאחרי הנימים מאפשרים לפלזמה לדלוף`],[`Nerve endings release fluid`,`קצות עצבים משחררים נוזל`],[`Lymph vessels are blocked by neutrophils`,`כלי הלימפה נחסמים על ידי נויטרופילים`]],a:1,e:[`The leaking fluid carries antibodies, complement and clotting factors to the site.`,`הנוזל שדולף מביא לאתר נוגדנים, משלים וגורמי קרישה.`]},
 {q:[`Why does aspirin reduce fever and pain but leave most of the immune response intact?`,`למה אספירין מוריד חום וכאב אבל משאיר את רוב התגובה החיסונית?`],o:[[`It kills bacteria`,`הוא הורג חיידקים`],[`It blocks prostaglandins only`,`הוא חוסם רק פרוסטגלנדינים`],[`It blocks all cytokines`,`הוא חוסם את כל הציטוקינים`],[`It removes neutrophils from the blood`,`הוא מסלק נויטרופילים מהדם`]],a:1,e:[`Aspirin blocks prostaglandin production. Steroids block much more, which is why they suppress immunity.`,`אספירין חוסם ייצור פרוסטגלנדינים. סטרואידים חוסמים הרבה יותר, ולכן הם מדכאים את מערכת החיסון.`]},
 {q:[`Why do innate receptors target highly conserved, essential microbial parts?`,`למה קולטנים מולדים מכוונים לחלקים שמורים וחיוניים של מיקרואורגניזמים?`],o:[[`Because those parts are the largest`,`כי החלקים האלה הם הגדולים ביותר`],[`Because microbes evolve fast and cannot change essential parts without harming themselves`,`כי מיקרואורגניזמים מתפתחים מהר ולא יכולים לשנות חלקים חיוניים בלי לפגוע בעצמם`],[`Because our own cells have the same parts`,`כי לתאים שלנו יש את אותם חלקים`],[`Because antibodies already cover the rest`,`כי נוגדנים כבר מכסים את השאר`]],a:1,e:[`Cell wall structures and nucleic acids are essential, so a microbe cannot simply mutate them away.`,`מבני דופן התא וחומצות הגרעין חיוניים, ולכן מיקרואורגניזם לא יכול פשוט לעבור מוטציה ולהיפטר מהם.`]},
 {q:[`Which is a DAMP rather than a PAMP?`,`מה מהבאים הוא DAMP ולא PAMP?`],o:[[`Lipopolysaccharide`,`ליפופוליסכריד`],[`Flagellin`,`פלגלין`],[`ATP released outside the cell by damaged cells`,`ATP שמשתחרר מחוץ לתא מתאים פגועים`],[`Unmethylated CpG DNA`,`DNA מסוג CpG לא ממותל`]],a:2,e:[`DAMPs come from our own damaged cells. They cause sterile inflammation, with no microbe involved.`,`DAMP מגיעים מתאים פגועים שלנו. הם גורמים לדלקת סטרילית, בלי מיקרואורגניזם.`]},
 {q:[`Which TLR recognises flagellin?`,`איזה TLR מזהה פלגלין?`],o:[[`TLR3`,`TLR3`],[`TLR4`,`TLR4`],[`TLR5`,`TLR5`],[`TLR9`,`TLR9`]],a:2,e:[`TLR5 sits on the cell surface and binds flagellin of bacteria that swim.`,`TLR5 יושב על פני התא וקושר פלגלין של חיידקים שוחים.`]},
 {q:[`Lipopolysaccharide (LPS) of Gram-negative bacteria is recognised by…`,`ליפופוליסכריד (LPS) של חיידקים גראם-שליליים מזוהה על ידי…`],o:[[`TLR4`,`TLR4`],[`TLR3`,`TLR3`],[`NOD2`,`NOD2`],[`RIG-I`,`RIG-I`]],a:0,e:[`TLR4 (with MD-2) binds LPS on the surface and later signals from the endosome.`,`TLR4 (עם MD-2) קושר LPS על פני התא ובהמשך מאותת מתוך האנדוזום.`]},
 {q:[`Why do the nucleic-acid TLRs (3, 7, 8, 9) sit in endosomes?`,`למה ה-TLR שמזהים חומצות גרעין (3, 7, 8, 9) יושבים באנדוזומים?`],o:[[`Because endosomes are more acidic, which makes DNA visible`,`כי אנדוזומים חומציים יותר, וזה הופך DNA לגלוי`],[`Because our own DNA and RNA should never be there, so location separates self from non-self`,`כי ה-DNA וה-RNA שלנו לא אמורים להיות שם, ולכן המיקום מבחין בין עצמי לזר`],[`Because they need MHC II to work`,`כי הם צריכים MHC II כדי לפעול`],[`Because viruses only enter through endosomes`,`כי נגיפים נכנסים רק דרך אנדוזומים`]],a:1,e:[`Nucleic acids look alike in microbes and in us, so the compartment is used as a filter.`,`חומצות גרעין נראות דומות אצל מיקרואורגניזמים ואצלנו, ולכן המדור משמש כמסנן.`]},
 {q:[`RIG-I and MDA5 detect…`,`RIG-I ו-MDA5 מזהים…`],o:[[`Viral RNA in the cytosol`,`RNA נגיפי בציטוזול`],[`Bacterial sugars on the cell surface`,`סוכרים חיידקיים על פני התא`],[`ATP outside the cell`,`ATP מחוץ לתא`],[`Peptidoglycan in the endosome`,`פפטידוגליקן באנדוזום`]],a:0,e:[`They catch RNA viruses that are replicating inside the cell (long double strands, uncapped ends).`,`הם תופסים נגיפי RNA שמשכפלים את עצמם בתוך התא (גדילים כפולים ארוכים, קצוות בלי כיפה).`]},
 {q:[`What does NLRP3 sense?`,`מה NLRP3 חש?`],o:[[`A single bacterial protein`,`חלבון חיידקי אחד`],[`Signs of cell damage such as potassium leaking out or a burst lysosome`,`סימני נזק לתא כמו אשלגן שדולף החוצה או ליזוזום שהתפוצץ`],[`Viral DNA in the nucleus`,`DNA נגיפי בגרעין`],[`Antibodies on the cell surface`,`נוגדנים על פני התא`]],a:1,e:[`NLRP3 does not bind one molecule. It responds to damage of any cause and builds the inflammasome.`,`NLRP3 לא קושר מולקולה אחת. הוא מגיב לנזק מכל סיבה ובונה את האינפלמזום.`]},
 {q:[`Which adaptor protein do all TLRs except TLR3 use?`,`באיזה חלבון מתאם משתמשים כל ה-TLR חוץ מ-TLR3?`],o:[[`TRIF`,`TRIF`],[`MyD88`,`MyD88`],[`IRF3`,`IRF3`],[`SHP-1`,`SHP-1`]],a:1,e:[`MyD88 leads to NF-κB and inflammatory cytokines. TLR3 uses TRIF, and TLR4 uses both.`,`MyD88 מוביל ל-NF-κB ולציטוקינים דלקתיים. TLR3 משתמש ב-TRIF, ו-TLR4 משתמש בשניהם.`]},
 {q:[`The TLR3 pathway (TRIF → IRF3) mainly produces…`,`המסלול של TLR3 (TRIF, IRF3) מייצר בעיקר…`],o:[[`IL-10`,`IL-10`],[`Type I interferon`,`אינטרפרון מסוג I`],[`Histamine`,`היסטמין`],[`Antibodies`,`נוגדנים`]],a:1,e:[`TLR3 detects double-stranded RNA of viruses, so its output is the antiviral interferon response.`,`TLR3 מזהה RNA דו-גדילי של נגיפים, ולכן התוצר שלו הוא תגובת האינטרפרון נגד נגיפים.`]},
 {q:[`What is the only type II interferon, and who makes it?`,`מהו האינטרפרון היחיד מסוג II, ומי מייצר אותו?`],o:[[`IFN-α, made by all cells`,`IFN-α, מיוצר בכל התאים`],[`IFN-λ, made by epithelial cells`,`IFN-λ, מיוצר בתאי אפיתל`],[`IFN-γ, made mainly by NK cells and T cells`,`IFN-γ, מיוצר בעיקר בתאי NK ובתאי T`],[`IFN-β, made by neutrophils`,`IFN-β, מיוצר בנויטרופילים`]],a:2,e:[`IFN-γ activates macrophages, drives Th1 cells and raises MHC I and II.`,`IFN-γ משפעל מקרופאג׳ים, מכוון לתאי Th1 ומעלה את MHC I ו-II.`]},
 {q:[`Type III interferons (IFN-λ) specialise in…`,`אינטרפרונים מסוג III (IFN-λ) מתמחים ב…`],o:[[`Killing worms`,`הריגת תולעים`],[`Antiviral defence in the epithelium of the airways and gut`,`הגנה אנטי-ויראלית באפיתל של דרכי הנשימה והמעי`],[`Making antibodies`,`ייצור נוגדנים`],[`Blood clotting`,`קרישת דם`]],a:1,e:[`They work like type I interferons but mainly at mucosal surfaces.`,`הם פועלים כמו אינטרפרונים מסוג I אבל בעיקר ברירית.`]},
 {q:[`Which pair of cytokines is anti-inflammatory?`,`איזה זוג ציטוקינים נוגד דלקת?`],o:[[`IL-1 and IL-6`,`IL-1 ו-IL-6`],[`IL-10 and TGF-β`,`IL-10 ו-TGF-β`],[`TNF-α and IL-12`,`TNF-α ו-IL-12`],[`IL-2 and IL-7`,`IL-2 ו-IL-7`]],a:1,e:[`IL-10 and TGF-β start resolution and suppress other inflammatory cytokines.`,`IL-10 ו-TGF-β מתחילים את סיום התגובה ומדכאים ציטוקינים דלקתיים אחרים.`]},
 {q:[`Which cytokine drives Th1 differentiation?`,`איזה ציטוקין מכוון להתמיינות ל-Th1?`],o:[[`IL-4`,`IL-4`],[`IL-12`,`IL-12`],[`IL-23`,`IL-23`],[`IL-7`,`IL-7`]],a:1,e:[`Th1: IL-12. Th2: IL-4. Th17: IL-21, IL-23, IL-6, TGF-β. Treg: TGF-β, IL-2, retinoic acid.`,`Th1: IL-12. Th2: IL-4. Th17: IL-21, IL-23, IL-6, TGF-β. Treg: TGF-β, IL-2, חומצה רטינואית.`]},
 {q:[`IL-4 acts on B cells, T cells and macrophages, with a different effect on each. This is called…`,`IL-4 פועל על תאי B, תאי T ומקרופאג׳ים, עם השפעה שונה על כל אחד. זה נקרא…`],o:[[`Redundancy`,`יתירות`],[`Synergy`,`סינרגיה`],[`Pleiotropy`,`פליאוטרופיה`],[`Cascade`,`מפל`]],a:2,e:[`Pleiotropy: one cytokine, different effects on different cells.`,`פליאוטרופיה: ציטוקין אחד, השפעות שונות על תאים שונים.`]},
 {q:[`IL-2 and IL-15 both keep T cells alive. This is an example of…`,`IL-2 ו-IL-15 שניהם שומרים על הישרדות תאי T. זו דוגמה ל…`],o:[[`Redundancy`,`יתירות`],[`Antagonism`,`אנטגוניזם`],[`Local action`,`פעולה מקומית`],[`Pleiotropy`,`פליאוטרופיה`]],a:0,e:[`Redundancy: different cytokines with similar effects.`,`יתירות: ציטוקינים שונים עם השפעות דומות.`]},
 {q:[`How does the IL-1 receptor antagonist stop inflammation?`,`איך האנטגוניסט לקולטן של IL-1 עוצר דלקת?`],o:[[`It destroys IL-1`,`הוא הורס את IL-1`],[`It sits in the IL-1 receptor without activating it`,`הוא יושב בקולטן של IL-1 בלי להפעיל אותו`],[`It kills macrophages`,`הוא הורג מקרופאג׳ים`],[`It blocks NF-κB in the nucleus`,`הוא חוסם את NF-κB בגרעין`]],a:1,e:[`It is one of the active brakes of resolution: IL-1 can no longer reach its receptor.`,`זה אחד הבלמים הפעילים של סיום התגובה: IL-1 כבר לא יכול להגיע לקולטן שלו.`]},
 {q:[`Chronic AREG–EGFR signalling can lead to…`,`איתות כרוני של AREG–EGFR יכול להוביל ל…`],o:[[`Fibrosis`,`פיברוזיס`],[`Anaphylaxis`,`אנפילקסיס`],[`Immunodeficiency`,`כשל חיסוני`],[`Faster pathogen clearance`,`סילוק מהיר יותר של הפתוגן`]],a:0,e:[`It leads to collagen production and extracellular matrix deposits that scar the tissue.`,`הוא מוביל לייצור קולגן ולשקיעה של מטריקס חוץ-תאי שמצלקים את הרקמה.`]},
 {q:[`How does apoptosis differ from necrosis?`,`במה אפופטוזיס שונה מנקרוזיס?`],o:[[`In apoptosis the cell swells and bursts`,`באפופטוזיס התא מתנפח ומתפוצץ`],[`In apoptosis the cell shrinks and breaks into sealed fragments, without inflammation`,`באפופטוזיס התא מתכווץ ומתפרק לשברים סגורים, בלי דלקת`],[`Necrosis is always programmed`,`נקרוזיס תמיד מתוכנת`],[`Only necrosis uses caspases`,`רק נקרוזיס משתמש בקספאזות`]],a:1,e:[`Necrosis is death by injury: the cell swells, ruptures and triggers inflammation.`,`נקרוזיס הוא מוות מפציעה: התא מתנפח, נקרע ומעורר דלקת.`]},
 {q:[`In the intrinsic pathway of apoptosis, what do the mitochondria release?`,`במסלול הפנימי של אפופטוזיס, מה המיטוכונדריה משחררות?`],o:[[`Cytochrome c`,`ציטוכרום c`],[`Perforin`,`פרפורין`],[`Histamine`,`היסטמין`],[`IL-1β`,`IL-1β`]],a:0,e:[`Cytochrome c in the cytosol activates caspase-9, which activates the effector caspases.`,`ציטוכרום c בציטוזול משפעל את קספאז-9, שמשפעל את הקספאזות המבצעות.`]},
 {q:[`Which caspases are the effector caspases that cut hundreds of cellular proteins?`,`אילו קספאזות הן הקספאזות המבצעות שחותכות מאות חלבונים בתא?`],o:[[`Caspase-1 and 8`,`קספאז-1 ו-8`],[`Caspase-3 and 7`,`קספאז-3 ו-7`],[`Caspase-8 and 9`,`קספאז-8 ו-9`],[`Caspase-1 only`,`רק קספאז-1`]],a:1,e:[`Caspase-8 and 9 are initiators. Caspase-1 is the inflammasome caspase.`,`קספאז-8 ו-9 הן מתחילות. קספאז-1 היא הקספאז של האינפלמזום.`]},
 {q:[`What makes the pores in pyroptosis?`,`מה יוצר את הנקבים בפירופטוזיס?`],o:[[`Perforin from NK cells`,`פרפורין מתאי NK`],[`Gasdermin D cut by caspase-1`,`גזדרמין D שנחתך על ידי קספאז-1`],[`Bax and Bak`,`Bax ו-Bak`],[`Complement`,`משלים`]],a:1,e:[`Caspase-1 cuts gasdermin D, whose pieces form pores. IL-1β escapes and the cell bursts.`,`קספאז-1 חותך את גזדרמין D, והחלקים שלו יוצרים נקבים. IL-1β יוצא והתא מתפוצץ.`]},
 {q:[`In inflammasome activation, what does signal 1 provide?`,`בשפעול האינפלמזום, מה אות 1 מספק?`],o:[[`Assembly of the inflammasome`,`הרכבת האינפלמזום`],[`Production of inactive pro-IL-1β through a TLR and NF-κB`,`ייצור pro-IL-1β לא פעיל דרך TLR ו-NF-κB`],[`Release of mature IL-1β`,`שחרור IL-1β בוגר`],[`Cell death`,`מוות של התא`]],a:1,e:[`Signal 2 (for example cell stress) assembles the inflammasome, and caspase-1 then makes mature IL-1β.`,`אות 2 (למשל עקה בתא) מרכיב את האינפלמזום, ואז קספאז-1 מייצר IL-1β בוגר.`]},
 {q:[`Which signal tells a macrophage NOT to eat a healthy cell?`,`איזה אות אומר למקרופאג׳ לא לבלוע תא בריא?`],o:[[`Phosphatidylserine`,`פוספטידילסרין`],[`ATP`,`ATP`],[`CD47`,`CD47`],[`IL-1β`,`IL-1β`]],a:2,e:[`CD47 is the don't-eat-me signal; tumours use it too. Phosphatidylserine is eat-me and ATP is find-me.`,`CD47 הוא אות אל-תאכל-אותי; גם גידולים משתמשים בו. פוספטידילסרין הוא אכול-אותי ו-ATP הוא מצא-אותי.`]},
