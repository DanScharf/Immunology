/* ---------- hover-definition engine ---------- */
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
let TIPRX={en:null,he:null};
function tipRegexes(){const he=LANG==='he';if(TIPRX[LANG])return TIPRX[LANG];
  const list=[];TIPS.forEach((tp,i)=>(he?tp[1]:tp[0]).forEach(f=>list.push({f,i})));list.sort((a,b)=>b.f.length-a.f.length);
  list.forEach(x=>{x.rx=he?new RegExp(`(^|[^\\u0590-\\u05FFA-Za-z0-9])([ובכלמשה]{0,3})(${reEsc(x.f)})(?![\\u0590-\\u05FFA-Za-z0-9])`):new RegExp(`(^|[^A-Za-z0-9-])(${reEsc(x.f)})(?![A-Za-z0-9])`,x.f===x.f.toLowerCase()?'i':'');});
  return TIPRX[LANG]=list;}
const TIP_SKIP='svg,a,button,h1,h2,h3,h4,summary,.tip,.pill,.eyebrow,th,dt,label,input,script,style,.mono,.seg,.steps,.filters,.flip,.qopts,#tipbox,.primer,.dictgrid,.dmodal';
function annotate(root){if(!root||root.nodeType!==1||root.closest('.tip,svg'))return;const he=LANG==='he';const used=new Set();
  for(const x of tipRegexes()){if(used.has(x.i))continue;
    const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
    while(n=tw.nextNode()){const p=n.parentElement;if(!p||p.closest(TIP_SKIP)||!p.closest('p,li,dd,td,figcaption,.callout,.node,.expl'))continue;
      const m=x.rx.exec(n.nodeValue);if(!m)continue;
      const start=m.index+m[1].length+(he?m[2].length:0), word=he?m[3]:m[2];
      const after=n.splitText(start);after.nodeValue=after.nodeValue.slice(word.length);
      const sp=document.createElement('span');sp.className='tip';sp.tabIndex=0;sp.dataset.t=x.i;sp.textContent=word;p.insertBefore(sp,after);
      used.add(x.i);break;}}}
const tipbox=document.createElement('div');tipbox.id='tipbox';tipbox.setAttribute('role','tooltip');tipbox.hidden=true;document.body.appendChild(tipbox);
let tipOn=null;
function showTip(el){const tp=TIPS[+el.dataset.t];if(!tp)return;tipbox.innerHTML=`<b>${esc(el.textContent)}</b> ${esc(L(tp[2],tp[3]))}`;tipbox.hidden=false;tipbox.style.left='0px';tipbox.style.top='0px';
  const r=el.getBoundingClientRect(),bw=tipbox.offsetWidth,bh=tipbox.offsetHeight;const left=Math.max(8,Math.min(innerWidth-bw-8,r.left+r.width/2-bw/2));let top=r.top-bh-10,below=false;if(top<8){top=r.bottom+10;below=true;}
  tipbox.style.left=left+'px';tipbox.style.top=top+'px';tipbox.classList.toggle('below',below);tipbox.style.setProperty('--ax',Math.max(12,Math.min(bw-12,r.left+r.width/2-left))+'px');tipOn=el;}
function hideTip(){tipbox.hidden=true;tipOn=null;}
function buildPrimer(id){if(id==='home'||/quiz|cards/.test(id))return;const sec=document.querySelector('#main section.view');if(!sec||sec.querySelector('.primer'))return;
  const seen=[];document.querySelectorAll('#main .tip').forEach(sp=>{const i=+sp.dataset.t;if(!seen.includes(i))seen.push(i);});if(!seen.length)return;

const CLS=[
 [`C1 binds`,`C1 נקשר`,`C1 is one C1q with two C1r and two C1s. C1q binds the tails (Fc) of two antibodies sitting side by side on the surface. This switches on C1r, and C1r switches on C1s. Free antibody floating in the blood cannot do this: C1q needs at least two tails close together.`,`C1 הוא C1q אחד עם שני C1r ושני C1s. C1q נקשר לזנבות (Fc) של שני נוגדנים שיושבים זה ליד זה על פני השטח. זה מפעיל את C1r, ו-C1r מפעיל את C1s. נוגדן חופשי שצף בדם לא יכול לעשות את זה: C1q צריך לפחות שני זנבות קרובים.`],
 [`C1s cuts C4`,`C1s חותך את C4`,`The large piece, C4b, attaches to the cell surface. The small piece, C4a, is released.`,`החלק הגדול, C4b, נצמד לפני התא. החלק הקטן, C4a, משתחרר.`],
 [`C2 joins: the C3 convertase`,`C2 מצטרף: ה-C3 convertase`,`C2 binds C4b and C1s cuts it. C2a stays on C4b and C2b is released. Together C4b and C2a form the C3 convertase, C4b2a. (Some newer texts swap the names and write C4b2b.)`,`C2 נקשר ל-C4b ו-C1s חותך אותו. C2a נשאר על C4b ו-C2b משתחרר. יחד C4b ו-C2a יוצרים את ה-C3 convertase,‏ C4b2a. (בחלק מהספרים החדשים השמות הפוכים וכותבים C4b2b.)`],
 [`C3 is cut`,`C3 נחתך`,`The C3 convertase cuts many C3 molecules. C3b coats the cell and marks it for phagocytes. C3a is released and promotes inflammation. One C1 makes many convertases, and each cuts hundreds of C3.`,`ה-C3 convertase חותך מולקולות C3 רבות. C3b מצפה את התא ומסמן אותו לפגוציטים. C3a משתחרר ומעודד דלקת. C1 אחד יוצר convertase רבים, וכל אחד חותך מאות C3.`]

];
const TREE={
 lt:[`LT-HSC · long-term HSC`,`LT-HSC · תא גזע לטווח ארוך`,`Renews itself for life and can sustain blood production for decades. It rests most of the time (quiescence) and divides only about once every 25–50 weeks in humans. TGF-β helps keep it quiet, which protects its DNA from copying errors.`,`מחדש את עצמו לכל החיים ויכול לקיים ייצור דם במשך עשרות שנים. רוב הזמן הוא במנוחה (quiescence) ומתחלק רק פעם ב-25–50 שבועות בערך אצל בני אדם. TGF-β עוזר לשמור עליו שקט, וכך ה-DNA שלו מוגן משגיאות העתקה.`],
 st:[`ST-HSC · short-term HSC`,`ST-HSC · תא גזע לטווח קצר`,`Renews itself for a limited time (weeks to months), then becomes an MPP.`,`מחדש את עצמו לזמן מוגבל (שבועות עד חודשים), ואז הופך ל-MPP.`],
 mpp:[`MPP · multipotent progenitor`,`MPP · תא אב רב-כשרוני`,`Makes every blood lineage but renews itself less than HSCs.`,`מייצר את כל שושלות הדם אבל מחדש את עצמו פחות מתאי הגזע.`],
 cmp:[`CMP · common myeloid progenitor`,`CMP · תא אב מיאלואידי משותף`,`Makes MEPs and GMPs.`,`מייצר MEP ו-GMP.`],

 mep:[`MEP · megakaryocyte-erythroid progenitor`,`MEP · תא אב למגהקריוציטים ולאריתרוציטים`,`Makes red cells and platelets (platelets bud off megakaryocytes).`,`מייצר כדוריות אדומות וטסיות (טסיות ננתקות ממגהקריוציטים).`],
 gmp:[`GMP · granulocyte-macrophage progenitor`,`GMP · תא אב לגרנולוציטים ומקרופאג׳ים`,`Makes granulocytes, monocytes and dendritic cells. GM-CSF drives this branch.`,`מייצר גרנולוציטים, מונוציטים ותאים דנדריטיים. GM-CSF מניע את הענף הזה.`],

const LIFE={

 mono:[`About 1 day in blood (classical monocytes), 4–7 days for other subsets. Then they become macrophages or dendritic cells.`,`כיום אחד בדם (מונוציטים קלאסיים), 4–7 ימים לתת-סוגים אחרים. אחר כך הם הופכים למקרופאג׳ים או לתאים דנדריטיים.`],

};
const NICHE={
 vessel:[`Blood vessels and endothelial cells`,`כלי דם ותאי אנדותל`,`The main HSC niche is around small blood vessels. Endothelial cells make the key niche factors CXCL12 and SCF.`,`הנישה העיקרית של תאי הגזע נמצאת סביב כלי דם קטנים. תאי האנדותל מייצרים את גורמי הנישה המרכזיים CXCL12 ו-SCF.`],
 stromal:[`Perivascular stromal cells`,`תאי סטרומה סביב כלי הדם`,`They make CXCL12 (also called SDF-1) and stem cell factor (SCF). CXCL12 binds CXCR4 and SCF binds c-Kit on the HSC. Both keep HSCs in the marrow and maintain them; deleting CXCL12 or CXCR4 empties the marrow of HSCs.`,`הם מייצרים CXCL12 (שנקרא גם SDF-1) ו-stem cell factor ‏(SCF). CXCL12 נקשר ל-CXCR4 ו-SCF נקשר ל-c-Kit על תא הגזע. שניהם שומרים את תאי הגזע במח העצם ומקיימים אותם; מחיקה של CXCL12 או CXCR4 מרוקנת את מח העצם מתאי גזע.`],
 hsc:[`The HSC`,`תא הגזע`,`Carries CXCR4 and c-Kit to receive the niche signals. It mostly rests (quiescence).`,`נושא CXCR4 ו-c-Kit כדי לקלוט את אותות הנישה. רוב הזמן הוא במנוחה (quiescence).`],
 bone:[`Bone`,`עצם`,`HSCs live in the marrow inside bones, next to the bone surface.`,`תאי הגזע חיים במח שבתוך העצמות, ליד פני העצם.`],
 osteoblast:[`Osteoblasts`,`אוסטאובלסטים`,`Bone-building cells. They release osteopontin, which limits HSC numbers, and they support lymphoid progenitors. They do not maintain HSCs through CXCL12 or SCF.`,`תאים שבונים עצם. הם משחררים אוסטאופונטין, שמגביל את מספר תאי הגזע, ותומכים בתאי אב לימפואידיים. הם לא מקיימים את תאי הגזע דרך CXCL12 או SCF.`],
 osteoclast:[`Osteoclast`,`אוסטאוקלסט`,`A bone-resorbing cell on the inner bone surface.`,`תא שמפרק עצם על פני העצם הפנימיים.`],
 macrophage:[`Bone marrow macrophages`,`מקרופאג׳ים של מח העצם`,`Help keep HSCs in the marrow.`,`עוזרים לשמור את תאי הגזע במח העצם.`],
 mk:[`Megakaryocytes`,`מגהקריוציטים`,`Quiet HSCs sit next to megakaryocytes. Their TGF-β (and CXCL4) helps return HSCs to rest after stress.`,`תאי גזע שקטים יושבים ליד מגהקריוציטים. ה-TGF-β שלהם (וגם CXCL4) עוזר להחזיר את תאי הגזע למנוחה אחרי עקה.`]
};
const GVH=[[`Tissue damage`,`נזק לרקמה`,`Conditioning, the irradiation or chemotherapy given before the transplant, damages the patient's tissues, most of all the gut lining. The damaged tissues release danger signals such as TNF.`,`ההכנה (conditioning), ההקרנה או הכימותרפיה שניתנות לפני ההשתלה, פוגעת ברקמות של המטופל, ובעיקר בדופן המעי. הרקמות הפגועות משחררות אותות סכנה כמו TNF.`],
 [`T cell activation`,`שפעול תאי T`,`The danger signals switch on the patient's own antigen presenting cells. They carry the patient's HLA, which differs from the donor's. Donor CD4 T cells see it through HLA class II, donor CD8 T cells through HLA class I, and they multiply.`,`אותות הסכנה משפעלים את התאים מציגי האנטיגן של המטופל עצמו. הם נושאים את ה-HLA של המטופל, ששונה משל התורם. תאי T מסוג CD4 של התורם מזהים אותו דרך HLA מסוג II, ותאי T מסוג CD8 דרך HLA מסוג I, והם מתרבים.`],
 [`Attack on tissues`,`תקיפת רקמות`,`Activated donor T cells and their cytokines attack the patient's tissues, mainly the skin, gut and liver. This is graft-versus-host disease.`,`תאי T משופעלים של התורם והציטוקינים שלהם תוקפים את רקמות המטופל, בעיקר עור, מעי וכבד. זו מחלת שתל נגד מאכסן.`]];
const TFS=[
 [`Myeloid vs red cells`,`מיאלואידי מול אדום`,'PU.1 ⊣ GATA1',`PU.1 binds GATA1 and blocks the megakaryocyte-erythroid fate (red cells and platelets). Higher PU.1 activity favours monocytes.`,`PU.1 נקשר ל-GATA1 וחוסם את הגורל המגהקריוציטי-אריתרואידי (כדוריות אדומות וטסיות). פעילות גבוהה יותר של PU.1 מעדיפה מונוציטים.`],
 [`Granulocyte vs monocyte`,`גרנולוציט מול מונוציט`,'C/EBPα',`C/EBPα directs the progenitor to the granulocyte-monocyte stage; mice without it have no neutrophils. Granulocytes need less PU.1 activity than monocytes.`,`C/EBPα מכוון את תא האב לשלב הגרנולוציט-מונוציט; לעכברים בלעדיו אין נויטרופילים. גרנולוציטים צריכים פחות פעילות של PU.1 ממונוציטים.`],
 [`Eosinophils`,`אאוזינופילים`,'GATA1 · GATA2 · IL-5',`GATA1 is essential for eosinophil commitment, and GATA2 alone can instruct it. Blocking IL-5 suppresses eosinophil maturation.`,`GATA1 חיוני להתחייבות לאאוזינופיל, ו-GATA2 לבדו יכול לכוון אליו. חסימת IL-5 מדכאת את הבשלת האאוזינופילים.`],
 [`B cells`,`תאי B`,'E2A → EBF1 → Pax5',`E2A, EBF1 and Pax5 drive the B cell programme. Pax5 locks in B cell identity.`,`E2A, ‏EBF1 ו-Pax5 מניעים את תוכנית תאי ה-B. Pax5 נועל את הזהות של תא B.`],
 [`T cells`,`תאי T`,'Notch → GATA3 · TCF1',`Notch receptor signals in the thymus switch on GATA3 and TCF1, which start the T cell programme. Notch also blocks B cell development there. (Notch is a receptor, not a transcription factor.)`,`אותות מקולטן Notch בתימוס מפעילים את GATA3 ו-TCF1, שמתחילים את תוכנית תאי ה-T. Notch גם חוסם שם התפתחות של תאי B. (Notch הוא קולטן, לא פקטור שעתוק.)`],
 [`NK cells and ILCs`,`תאי NK ו-ILC`,'Id2 · Nfil3 → T-bet / GATA3 / RORγt',`Id2 and Nfil3 come first, then T-bet, GATA3 or RORγt: the same factors that define the helper T cell subsets.`,`Id2 ו-Nfil3 באים קודם, ואחריהם T-bet,‏ GATA3 או RORγt: אותם פקטורים שמגדירים את תת-סוגי תאי ה-T המסייעים.`]
];

    ${[[`Complement is a cascade of blood proteins that tags pathogens for phagocytes (C3b), calls in inflammation (C3a, C5a) and punches holes in them (the membrane attack complex).`,`המשלים הוא מפל של חלבוני דם שמסמן פתוגנים לפגוציטים (C3b), מזמין דלקת (C3a,‏ C5a) ומנקב בהם חורים (קומפלקס התקיפה של הממברנה).`],
       [`Three pathways start it: classical (antibodies), lectin (sugars) and alternative (always on, amplifies the others). All three build a C3 convertase and then share every step.`,`שלושה מסלולים מפעילים אותו: הקלאסי (נוגדנים), הלקטין (סוכרים) והחלופי (פעיל תמיד ומגביר את האחרים). שלושתם בונים C3 convertase ומשם עוברים את אותם שלבים.`],
       [`All blood cells come from hematopoietic stem cells in the bone marrow, through myeloid and lymphoid progenitors. Transcription factors decide each fate.`,`כל תאי הדם באים מתאי גזע המטופויטיים במח העצם, דרך תאי אב מיאלואידיים ולימפואידיים. פקטורי שעתוק מכריעים את הגורל של כל תא.`],
       [`Innate cells live hours to days and are replaced constantly; lymphocytes live years; many tissue macrophages renew themselves in place, and they can be "trained".`,`תאים מולדים חיים שעות עד ימים ומוחלפים כל הזמן; לימפוציטים חיים שנים; מקרופאג׳ים רבים ברקמות מחדשים את עצמם במקום, ואפשר "לאמן" אותם.`],
       [`Stem cells live in a niche around blood vessels that keeps them quiet and in place (CXCL12–CXCR4, SCF–c-Kit).`,`תאי גזע חיים בנישה סביב כלי דם שמשאירה אותם שקטים ובמקום (CXCL12–CXCR4,‏ SCF–c-Kit).`],
       [`In a transplant from a donor, the host can reject the graft and the graft can attack the host (GVHD), so HLA matching matters.`,`בהשתלה מתורם, המקבל יכול לדחות את השתל והשתל יכול לתקוף את המקבל (GVHD), ולכן התאמת HLA חשובה.`]].map((s,i)=>`<p>${i+1}. ${L(s[0],s[1])}</p>`).join('')}
  </div>
  ${nb3(0)}
</section>`;

R3['l3-complement']=()=>`
<section class="view">
  <div class="stack"><span class="eyebrow">${L('Chapter 1 · slides 2–8','פרק 1 · שקופיות 2–8')}</span><h2>${L('Complement: CDC','המשלים: CDC')}</h2>
  <p class="lead">${L('Complement-dependent cytotoxicity (CDC) is the third innate killing mechanism, after cell death and ADCC. Complement is a set of blood proteins that switch each other on in a cascade.','ציטוטוקסיות תלוית משלים (CDC) היא מנגנון ההרג המולד השלישי, אחרי מוות תאי ו-ADCC. המשלים הוא קבוצה של חלבוני דם שמפעילים זה את זה במפל.')}</p></div>
  <div class="grid g3">
    <div class="card stack"><span class="pill inn">1</span><h3>${L('Opsonisation','אופסוניזציה')}</h3><p>${L('Makes phagocytosis easier by coating the pathogen.','מקלה על פגוציטוזה בכך שהיא מצפה את הפתוגן.')}</p></div>
    <div class="card stack"><span class="pill inn">2</span><h3>${L('Inflammation','דלקת')}</h3><p>${L('Increases inflammation by boosting immune cell activity.','מגבירה דלקת בכך שהיא מחזקת את פעילות תאי החיסון.')}</p></div>
    <div class="card stack"><span class="pill inn">3</span><h3>${L('Lysis','ליזיס')}</h3><p>${L('Punches holes in the pathogen\'s membrane.','מנקבת חורים בממברנה של הפתוגן.')}</p></div>
  </div>
  ${fig(FIG3.adcccdc(),L('Both start with antibodies on the target. In ADCC an NK cell grabs the antibody tail; in CDC the bound antibodies switch on complement.','שניהם מתחילים בנוגדנים על המטרה. ב-ADCC תא NK נאחז בזנב הנוגדן; ב-CDC הנוגדנים הקשורים מפעילים את המשלים.'))}
  <div class="card stack"><h3>${L('The classical pathway, step by step','המסלול הקלאסי, שלב אחרי שלב')}</h3>
    <p>${L('Triggered by antibodies bound to antigens on a surface.','מופעל על ידי נוגדנים שקשורים לאנטיגנים על פני שטח.')}</p>
    ${stepBtns('clsteps',CLS)}<div id="clfig"></div><p id="cltext" aria-live="polite"></p>
    <details class="reveal"><summary>${L('More: C1q and lupus','הרחבה: C1q וזאבת')}</summary><p>${L('C1q also binds C-reactive protein and the surface of dying cells directly, so this pathway is older than antibodies. People who lack C1q almost always get lupus (C4 or C2 deficiency less often): immune complexes and debris from dying cells are not cleared and become targets of autoimmunity.','C1q נקשר גם ל-C-reactive protein ולפני השטח של תאים גוססים באופן ישיר, ולכן המסלול הזה עתיק יותר מהנוגדנים. אנשים שחסר להם C1q כמעט תמיד חולים בזאבת (חסר ב-C4 או C2 פחות): קומפלקסים חיסוניים ושאריות של תאים מתים לא מפונים והופכים למטרות של אוטואימוניות.')}</p></details>
  </div>
  <div class="stack"><h3>${L('After C3: the three outcomes','אחרי C3: שלוש התוצאות')}</h3>
    <p>${L('When one more C3b joins the C3 convertase, it becomes the <b>C5 convertase</b>. It cuts C5 into C5a and C5b. C3a and C5a are called <b>anaphylatoxins</b>.','כש-C3b נוסף מצטרף ל-C3 convertase, הוא הופך ל<b>C5 convertase</b>. הוא חותך את C5 ל-C5a ול-C5b. ‏C3a ו-C5a נקראים <b>אנפילטוקסינים</b>.')}</p>
    ${fig(FIG3.outcomes())}</div>
  <div class="card stack"><h3>${L('Lysis: building the membrane attack complex (MAC)','ליזיס: בניית קומפלקס התקיפה של הממברנה (MAC)')}</h3>
    ${stepBtns('macsteps',MACS)}<div id="macfig"></div><p id="mactext" aria-live="polite"></p>
    <p style="color:var(--muted)">${L('Low levels of MAC on our own cells can trigger signalling instead of death.','רמות נמוכות של MAC על התאים שלנו יכולות להפעיל איתות במקום מוות.')}</p></div>
  ${nb3(1)}
</section>`;

R3['l3-pathways']=()=>`
<section class="view">
  <div class="stack"><span class="eyebrow">${L('Chapter 2 · slides 9–14','פרק 2 · שקופיות 9–14')}</span><h2>${L('Three ways to start complement','שלוש דרכים להפעיל את המשלים')}</h2>
  <p class="lead">${L('Each pathway has its own trigger. All three build a C3 convertase, and from that point they share every step.','לכל מסלול יש מפעיל משלו. שלושתם בונים C3 convertase, ומשם הם עוברים את אותם שלבים בדיוק.')}</p></div>
  <div class="card stack"><h3>${L('The lectin pathway: sugars instead of antibodies','מסלול הלקטין: סוכרים במקום נוגדנים')}</h3>
    ${fig(FIG3.lectin())}
    <ul class="clean">
      <li>${L('Three families of blood proteins start it: <b>mannose-binding lectin (MBL)</b>, <b>ficolins</b> 1–3 and <b>collectins</b> 10 and 11. Each has collagen stalks like C1q and heads that bind sugars on pathogens.','שלוש משפחות של חלבוני דם מפעילות אותו: <b>mannose-binding lectin ‏(MBL)</b>, <b>פיקולינים</b> 1–3 ו<b>קולקטינים</b> 10 ו-11. לכל אחד יש גבעולי קולגן כמו ל-C1q וראשים שקושרים סוכרים על פני פתוגנים.')}</li>
      <li>${L('Each carries <b>MASPs</b> (MBL-associated serine proteases), which switch on when the heads bind. MASP-1 activates itself and then MASP-2; MASP-2 cuts C4; both cut C2.','כל אחד נושא <b>MASP</b> (פרוטאזות סרין שקשורות ל-MBL), שמופעלים כשהראשים נקשרים. MASP-1 מפעיל את עצמו ואז את MASP-2; ‏MASP-2 חותך את C4; שניהם חותכים את C2.')}</li>
      <li>${L('The result is <b>C4b2a</b>, the same C3 convertase as the classical pathway. It works early in infection, before any antibodies exist. MBL is an acute-phase protein made by the liver.','התוצאה היא <b>C4b2a</b>, אותו C3 convertase כמו במסלול הקלאסי. הוא פועל מוקדם בזיהום, לפני שיש נוגדנים. MBL הוא חלבון של השלב החריף שמיוצר בכבד.')}</li>
    </ul>
    <p style="color:var(--muted)">${L('Children with low levels of lectin pathway proteins can have recurrent infections.','לילדים עם רמות נמוכות של חלבוני מסלול הלקטין עלולים להיות זיהומים חוזרים.')}</p></div>
  <div class="card stack"><h3>${L('The alternative pathway: always on, kept in check','המסלול החלופי: תמיד פעיל, ונשמר בשליטה')}</h3>
    <p>${L('A little C3 is always active in the blood ("tickover": C3 slowly reacts with water and acts like C3b). So complement checks every surface without waiting for antibodies or sugar recognition. What happens next depends on the surface. Switch between a pathogen and one of our own cells.','קצת C3 תמיד פעיל בדם ("tickover": ‏C3 מגיב לאט עם מים ומתנהג כמו C3b). כך המשלים בודק כל משטח בלי לחכות לנוגדנים או לזיהוי סוכרים. מה שקורה אחר כך תלוי במשטח. החליפו בין פתוגן לבין תא שלנו.')}</p>
    ${seg('altseg',[['pathogen',L('On a pathogen','על פתוגן')],['host',L('On our own cell','על תא שלנו')]])}
    <div id="altfig"></div><p id="alttext" aria-live="polite"></p></div>
  <div class="stack"><h3>${L('The amplification loop','לולאת ההגברה')}</h3>
    ${fig(FIG3.loop(),L('Every C3b on a surface can bind factor B and become a new convertase, so each convertase makes more. C3b from the classical and lectin pathways enters the same loop: whichever pathway starts it, most of the C3b on a target (80–90% of C5 activation in experiments) comes from this loop.','כל C3b על משטח יכול לקשור פקטור B ולהפוך ל-convertase חדש, כך שכל convertase מייצר עוד. C3b מהמסלול הקלאסי ומסלול הלקטין נכנס לאותה לולאה: לא משנה איזה מסלול מתחיל, רוב ה-C3b על המטרה (80–90% משפעול C5 בניסויים) מגיע מהלולאה הזו.'))}</div>
  <div class="card stack"><h3>${L('Summary: pick a pathway','סיכום: בחרו מסלול')}</h3>
    ${seg('sumseg',[['all',L('All','הכול')],['cl',L('Classical','קלאסי')],['le',L('Lectin','לקטין')],['al',L('Alternative','חלופי')]])}
    <div id="sumfig"></div></div>
  ${nb3(2)}
</section>`;

  <div class="stack"><h3>${L('Lineage choice is written by transcription factors','בחירת השושלת נכתבת על ידי פקטורי שעתוק')}</h3>
  <div class="grid g3">${TFS.map(f=>`<div class="card stack"><h3>${L(f[0],f[1])}</h3><span class="tfchip">${f[2]}</span><p>${L(f[3],f[4])}</p></div>`).join('')}</div></div>
  <div class="card stack"><h3>${L('How long each cell lives','כמה זמן חי כל תא')}</h3>
    <p>${L('Click a row. The time scale is logarithmic: each step to the right is about ten times longer. Pink is innate, purple is lymphocytes, grey is other blood cells. Faded bars are ranges or the blood phase.','לחצו על שורה. סקאלת הזמן לוגריתמית: כל צעד ימינה ארוך פי עשרה בערך. ורוד הוא מולד, סגול הוא לימפוציטים, אפור הוא תאי דם אחרים. פסים דהויים הם טווחים או השלב בדם.')}</p>
    <div id="lifefig"></div><div class="callout" id="lifetext" aria-live="polite"></div>
    <p><b>${L('Innate cells live hours to days and are replaced constantly. Lymphocytes live years.','תאים מולדים חיים שעות עד ימים ומוחלפים כל הזמן. לימפוציטים חיים שנים.')}</b> ${L('Why do tissue macrophages renew themselves while neutrophils don\'t? Macrophages stay in their tissue for life and maintain themselves locally; neutrophils are short-lived by design, so the marrow does the replacing.','למה מקרופאג׳ים ברקמות מחדשים את עצמם ונויטרופילים לא? המקרופאג׳ים נשארים ברקמה שלהם לכל החיים ומתחזקים את עצמם במקום; נויטרופילים קצרי חיים מלכתחילה, ולכן מח העצם הוא שמחליף אותם.')}</p></div>
  <div class="card stack"><h3>${L('Trained immunity: an innate "memory"','חסינות מאומנת: "זיכרון" מולד')}</h3>
    ${fig(FIG3.trained())}
    <div class="grid g2" style="align-items:center">
      <p>${L('After a first pathogen, a macrophage rests but keeps <b>epigenetic marks</b>: chemical tags on DNA and on the histone proteins that package it. The DNA sequence does not change. A later encounter, even with an unrelated pathogen, gets a faster and stronger response. Example: training human monocytes with beta-glucan from the fungus Candida raises the mark H3K4me3 at the TNF and IL-6 genes, keeping them open for at least a week.','אחרי פתוגן ראשון, המקרופאג׳ נח אבל שומר <b>סימנים אפיגנטיים</b>: תגים כימיים על ה-DNA ועל חלבוני ההיסטון שאורזים אותו. רצף ה-DNA לא משתנה. מפגש מאוחר יותר, אפילו עם פתוגן לא קשור, מקבל תגובה מהירה וחזקה יותר. דוגמה: אימון מונוציטים אנושיים עם בטא-גלוקן מהפטרייה Candida מעלה את הסימן H3K4me3 בגנים של TNF ו-IL-6, ומשאיר אותם פתוחים לפחות שבוע.')}</p>
      ${FIG3.histone()}</div>
    <div class="grid g2">
      <div class="callout"><b>${L('Compared with adaptive memory','בהשוואה לזיכרון הנרכש')}</b> ${L('Trained immunity is less specific and shorter: at least 3 months, up to about a year. Some stimuli make the second response weaker instead.','חסינות מאומנת פחות ספציפית וקצרה יותר: לפחות 3 חודשים, עד שנה בערך. חלק מהגירויים דווקא מחלישים את התגובה השנייה.')}</div>
      <div class="callout pink"><b>${L('How can it last months if monocytes live days?','איך זה מחזיק חודשים אם מונוציטים חיים ימים?')}</b> ${L('Training can reach the long-lived stem and progenitor cells in the bone marrow, which keep producing trained monocytes. Long-lived tissue macrophages can also stay trained themselves.','האימון יכול להגיע לתאי הגזע ותאי האב ארוכי החיים במח העצם, שממשיכים לייצר מונוציטים מאומנים. גם מקרופאג׳ים ארוכי חיים ברקמות יכולים להישאר מאומנים בעצמם.')}</div>
    </div></div>
  ${nb3(5)}
</section>`;

    ['Sca-1',L('mouse only; mouse HSCs are Lin⁻ Sca-1⁺ c-Kit⁺ ("LSK")','רק בעכבר; תאי הגזע בעכבר הם Lin⁻ Sca-1⁺ c-Kit⁺ ‏("LSK")')]])}</div>

    ${fig(FIG3.transplant(),L('HLA (human leukocyte antigen) is the human MHC. It is the most variable set of genes in the human genome, and matching it is the main criterion for choosing a donor. Fewer than 30% of patients have an HLA-matched sibling. SCF and other cytokines can support HSCs in culture.','HLA ‏(human leukocyte antigen) הוא ה-MHC של האדם. זו קבוצת הגנים המגוונת ביותר בגנום האנושי, והתאמה שלה היא הקריטריון העיקרי לבחירת תורם. לפחות מ-30% מהמטופלים יש אח או אחות עם HLA תואם. SCF וציטוקינים אחרים יכולים לתמוך בתאי גזע בתרבית.'))}</div>

  ${nb3(6)}
</section>`;

R3['l3-wrap']=()=>`
<section class="view">
  <div class="stack"><span class="eyebrow">${L('Chapter 7 · slides 43–45','פרק 7 · שקופיות 43–45')}</span><h2>${L('Innate immunity: putting it together','חסינות מולדת: מחברים את הכול')}</h2>
  <p class="lead">${L('This closes the innate part of the course. The two arms solve the same problem in opposite ways.','זה סוגר את החלק המולד של הקורס. שתי הזרועות פותרות את אותה בעיה בדרכים הפוכות.')}</p></div>
  <div class="cmp" data-focus="both">
    <div class="cmprow head"><div class="k"></div><div class="c i">${L('Innate','מולדת')}</div><div class="c a">${L('Adaptive','נרכשת')}</div></div>
    ${[[L('Receptors','קולטנים'),L('PRRs, the same on every cell of a type','PRR, זהים בכל התאים מאותו סוג'),L('TCR or BCR, different on each lymphocyte','TCR או BCR, שונה בכל לימפוציט')],
       [L('Recognition','זיהוי'),L('shared patterns of pathogens (PAMPs) and damage (DAMPs)','תבניות משותפות של פתוגנים (PAMP) ושל נזק (DAMP)'),L('one exact molecule, the antigen','מולקולה אחת מדויקת, האנטיגן')],
       [L('Speed','מהירות'),L('minutes to hours','דקות עד שעות'),L('4–7 days after a first exposure, because the few matching cells must multiply','4–7 ימים אחרי חשיפה ראשונה, כי התאים המעטים שמתאימים צריכים להתרבות')],
       [L('Memory','זיכרון'),L('no antigen-specific memory (trained immunity gives non-specific readiness)','אין זיכרון ספציפי לאנטיגן (חסינות מאומנת נותנת מוכנות לא ספציפית)'),L('memory cells give a faster, stronger second response','תאי זיכרון נותנים תגובה שנייה מהירה וחזקה יותר')],
       [L('Self vs non-self','עצמי מול זר'),L('built into the receptors, which bind what the body does not have','בנוי לתוך הקולטנים, שקושרים את מה שאין בגוף'),L('learned, by removing or suppressing self-reactive lymphocytes','נלמד, בסילוק או בדיכוי של לימפוציטים שמגיבים לעצמי')]].map(r=>`<div class="cmprow"><div class="k">${r[0]}</div><div class="c i">${r[1]}</div><div class="c a">${r[2]}</div></div>`).join('')}
  </div>
  <div class="stack"><h3>${L('A layered defence: each layer buys time','הגנה בשכבות: כל שכבה קונה זמן')}</h3>
    <div class="layers">
      <div class="layer"><span class="eyebrow">${L('0 – 4 hours','0–4 שעות')}</span><h4>${L('Barriers and ready-made effectors','מחסומים ואפקטורים מוכנים')}</h4><p>${L('Skin, mucosa, complement and resident macrophages act at once, with nothing to induce.','עור, רירית, משלים ומקרופאג׳ים שוכני רקמה פועלים מיד, בלי שצריך להשרות כלום.')}</p></div>
      <div class="layer"><span class="eyebrow">${L('4 hours – 4 days','4 שעות – 4 ימים')}</span><h4>${L('Induced innate response','תגובה מולדת מושרית')}</h4><p>${L('PRRs sense the pathogen, cytokines call in neutrophils, monocytes and NK cells, and inflammation begins.','PRR חשים את הפתוגן, ציטוקינים מזמינים נויטרופילים, מונוציטים ותאי NK, והדלקת מתחילה.')}</p></div>
      <div class="layer"><span class="eyebrow">${L('4 days – weeks','4 ימים – שבועות')}</span><h4>${L('Adaptive response','תגובה נרכשת')}</h4><p>${L('The few matching lymphocytes multiply, then T cells and antibodies clear the pathogen and memory remains.','הלימפוציטים המעטים שמתאימים מתרבים, ואז תאי T ונוגדנים מסלקים את הפתוגן ונשאר זיכרון.')}</p></div>
    </div>
    <p><b>${L('Many pathogens are stopped by the two innate layers before the adaptive response is needed.','פתוגנים רבים נעצרים בשתי השכבות המולדות לפני שצריך את התגובה הנרכשת.')}</b></p></div>
  <div class="stack"><h3>${L('Innate detects, adaptive directs, both execute','המולדת מזהה, הנרכשת מכוונת, שתיהן מבצעות')}</h3>
    ${fig(FIG.coop())}
    <ol class="steps-list">${[[`Fast and fixed`,`מהירה וקבועה`,`The same receptors on every cell read shared patterns of pathogens and of damage.`,`אותם קולטנים בכל תא קוראים תבניות משותפות של פתוגנים ושל נזק.`],[`Decides kill or spare`,`מחליטה להרוג או לחוס`,`For example NK cells checking for missing self. It kills by phagocytosis, cell death and complement.`,`למשל תאי NK שבודקים עצמי חסר. היא הורגת בפגוציטוזה, במוות תאי ובמשלים.`],[`Holds the line`,`מחזיקה את הקו`,`For days, and tells the adaptive arm what to respond to.`,`במשך ימים, ואומרת לזרוע הנרכשת למה להגיב.`],[`Both arms execute`,`שתי הזרועות מבצעות`,`NK cells and CD8 T cells kill infected cells, and antibodies recruit innate effectors (complement, ADCC).`,`תאי NK ותאי T מסוג CD8 הורגים תאים נגועים, ונוגדנים מגייסים אפקטורים מולדים (משלים, ADCC).`]].map(s=>`<li><b>${L(s[0],s[1])}</b><span>${L(s[2],s[3])}</span></li>`).join('')}</ol></div>
  ${nb3(7)}
</section>`;

 </section>`;};

 $('#dictq').oninput=apply;$('#dictf').onclick=e=>{const b=e.target.closest('button');if(!b)return;f=b.dataset.f;document.querySelectorAll('#dictf button').forEach(x=>x.setAttribute('aria-pressed',x===b));apply();};
 const open=i=>{const d=DICT[i];const c=cellOf(d);$('#dbody').innerHTML=`<span class="pill ${d.cat?'ada':''}">${d.cat?L('Lesson ','שיעור ')+d.cat:L('Basic science','מדע בסיסי')}</span><h2 id="dtitle">${esc(d.term)}</h2>${d.term!==d.key&&LANG==='he'?`<p class="mono" style="color:var(--muted)">${esc(d.key)}</p>`:''}<p class="lead">${esc(d.def)}</p>${c?`<div class="dcell">${CELLSVG[c]}</div>`:''}${d.fig?`<figure class="fig">${d.fig()}</figure>`:''}${d.start?`<a class="btn primary" href="#${d.start}">${L('Open the lesson','לפתוח את השיעור')} ${d.cat} ${L('→','←')}</a>`:''}`;$('#dmodal').hidden=false;$('#dclose').focus();};

function lessonOf(id){

  const v2=l2views();if(v2.some(x=>x.id===id))return {n:2,views:v2,R:R2,I:INIT2,name:L('Innate immunity: functional mechanisms','חסינות מולדת: מנגנוני פעולה')};
  const v3=l3views();if(v3.some(x=>x.id===id))return {n:3,views:v3,R:R3,I:INIT3,name:L('Complement, and where immune cells come from','המשלים, ומאיפה באים תאי החיסון')};
  return null;}
function route(){

}
/* ---------- dAIsy-lite: a free study helper that searches the course content (no AI, no key) ---------- */
const DAISY={msgs:[],idx:null,idxLang:null,quiz:null};
const daisyFlower=s=>`<svg viewBox="0 0 40 40" width="${s}" height="${s}" aria-hidden="true">${Array.from({length:8},(_,i)=>`<ellipse cx="20" cy="9" rx="5" ry="8.5" fill="#fff" stroke="#e9d9ef" transform="rotate(${i*45} 20 20)"/>`).join('')}<circle cx="20" cy="20" r="6.5" fill="#f2b632"/></svg>`;
const DZ_STOP=new Set(('a an the of to in on and or is are was be it this that what which who how why when where do does did can could i me my you your we for with from as at by about tell explain define definition mean means meaning please quiz question'+
 ' מה מי איך למה מתי איפה זה זו זאת של על עם את אני אתה את הוא היא הם הן יש אין או גם כל לי לך תסבירי הסבירי הסבר תסביר תגידי ספרי בבקשה משמעות הגדרה פירוש').split(' '));
const DZ_PRE=/^[ובכלמשה]{1,3}(?=[֐-׿]{3,})/;
function dzTokens(s){return (s.toLowerCase().match(/[a-z0-9α-ωκγβλ\-\+]+|[֐-׿״׳"']+/g)||[]).map(w=>w.replace(/["'׳״]/g,'').replace(/^-+|-+$/g,'')).filter(w=>w.length>1&&!DZ_STOP.has(w)).map(w=>/[֐-׿]/.test(w)?w.replace(DZ_PRE,''):w.replace(/(ies)$/,'y').replace(/(?<=[a-z]{3})s$/,''));}
function dzLessons(){return [{n:1,views:VIEWS,R:LANG==='he'?RH:R,quiz:()=>QUIZ},{n:2,views:l2views(),R:R2,quiz:l2quiz},{n:3,views:l3views(),R:R3,quiz:l3quiz}];}
function dzIndex(){if(DAISY.idx&&DAISY.idxLang===LANG)return DAISY.idx;const chunks=[];const box=document.createElement('div');
  dzLessons().forEach(ls=>ls.views.forEach(v=>{if(/quiz|cards/.test(v.id))return;let html='';try{html=ls.R[v.id]();}catch(e){return;}box.innerHTML=html;box.querySelectorAll('svg,.next,.howto,.smear,button').forEach(n=>n.remove());
    const title=(box.querySelector('h1,h2')||{}).textContent||v.label;
    box.querySelectorAll('p,li,tr,figcaption,.callout,.cmprow,.layer,dd').forEach(el=>{if(el.closest('li,tr,.callout,.cmprow,.layer')!==el&&el.closest('li,tr,.callout,.cmprow,.layer'))return;
      const txt=el.textContent.replace(/\s+/g,' ').trim();if(txt.length<25)return;const holder=el.closest('.card,.stack,details')||box;const h=(holder.querySelector('h3,h4,summary')||{}).textContent||title;
      chunks.push({txt,head:h.trim(),title,view:v.id,label:v.label,lesson:ls.n,tok:dzTokens(txt+' '+h)});});}));
  try{dictBuild();}catch(e){}
  const df={};chunks.forEach(c=>new Set(c.tok).forEach(t=>df[t]=(df[t]||0)+1));
  DAISY.idx={chunks,df,N:chunks.length};DAISY.idxLang=LANG;return DAISY.idx;}
function dzSearch(q,k=3){const ix=dzIndex();const qt=[...new Set(dzTokens(q))];if(!qt.length)return {hits:[],qt:[]};
  const sc=ix.chunks.map(c=>{let s=0;qt.forEach(t=>{const n=c.tok.filter(x=>x===t||(t.length>4&&x.startsWith(t))||(x.length>4&&t.startsWith(x))).length;if(n)s+=(1+Math.log(n))*Math.log(1+ix.N/(ix.df[t]||1));});return {c,s};}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  const out=[],seen=new Set();for(const x of sc){const key=x.c.view+x.c.head;if(seen.has(key))continue;seen.add(key);out.push(x.c);if(out.length>=k)break;}return {hits:out,qt};}
function dzDict(q){const qt=dzTokens(q);if(!qt.length||!DICT.length)return null;const ql=q.toLowerCase();
  let best=null,bs=0;DICT.forEach(d=>{const names=[d.term.toLowerCase(),d.term.replace(/\s*\(.*\)\s*$/,'').toLowerCase(),d.key.toLowerCase()];let s=0;names.forEach(n=>{if(ql.includes(n)&&n.length>1)s=Math.max(s,10+n.length);const nt=dzTokens(n);if(nt.length&&nt.every(t=>qt.includes(t)))s=Math.max(s,8+n.length);});if(s>bs){bs=s;best=d;}});return best;}
const dzMark=(txt,qt)=>{let h=esc(txt.length>320?txt.slice(0,320)+'…':txt);qt.filter(t=>t.length>2).forEach(t=>{h=h.replace(new RegExp('('+reEsc(t)+')','gi'),'<mark>$1</mark>');});return h;};
const dzWhere=c=>`${L('Lesson','שיעור')} ${c.lesson} · ${esc(c.label)}`;
function dzCurrentLesson(){const id=(location.hash||'#home').slice(1);const ls=lessonOf(id);return ls?ls.n:0;}
function dzAnswer(q){dzIndex();const ql=q.toLowerCase();
  if(/quiz|test me|question|בחני|תבחני|בחן|שאלה|מבחן אותי/.test(ql))return dzQuizStart();
  if(/this page|העמוד|הדף/.test(ql))return dzPage();
  if(/exam|remember|summary|summar|key point|למבחן|לזכור|סיכום|עיקר/.test(ql))return dzSummary();
  const d=dzDict(q);const {hits,qt}=dzSearch(q);
  if(!d&&!(hits&&hits.length))return `<p>${L('I couldn\'t find that in the course material. Try other words, or a term from the slides, for example "complement" or "NK cell".','לא מצאתי את זה בחומר הקורס. נסו מילים אחרות, או מונח מהשקפים, למשל "משלים" או "תא NK".')}</p>`;
  let h='';
  if(d)h+=`<div class="dz-def"><b>${esc(d.term)}</b><p>${esc(d.def)}</p><div class="dz-links"><a href="#dictionary" data-dict="${esc(d.key)}">${L('Open in dictionary','לפתוח במילון')}</a>${d.start?`<a href="#${d.start}">${L('Lesson','שיעור')} ${d.cat}</a>`:''}</div></div>`;
  if(hits.length)h+=`<p class="dz-sub">${d?L('Where it comes up in the lessons:','איפה זה מופיע בשיעורים:'):L('Here is what the lessons say:','זה מה שכתוב בשיעורים:')}</p>`+hits.map(c=>`<div class="dz-hit"><span class="dz-where">${dzWhere(c)} · ${esc(c.head)}</span><p>${dzMark(c.txt,qt)}</p><a href="#${c.view}">${L('Go to this page','למעבר לעמוד')} ${L('→','←')}</a></div>`).join('');
  return h;}
function dzPage(){const id=(location.hash||'#home').slice(1);const sec=$('#main section.view');if(!sec||!lessonOf(id))return `<p>${L('Open a lesson page first, then ask me to explain it.','פתחו קודם עמוד של שיעור, ואז בקשו ממני להסביר אותו.')}</p>`;
  const title=(sec.querySelector('h1,h2')||{}).textContent||'';const lead=(sec.querySelector('.lead')||{}).textContent||'';
  const heads=[...sec.querySelectorAll('h3')].map(h=>h.textContent.trim()).filter(Boolean).slice(0,10);
  const terms=[...sec.querySelectorAll('.primer dt')].map(d=>d.textContent).slice(0,12);
  return `<p><b>${esc(title)}</b></p>${lead?`<p>${esc(lead)}</p>`:''}${heads.length?`<p class="dz-sub">${L('This page covers, in order:','העמוד הזה עובר, לפי הסדר, על:')}</p><ul>${heads.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>`:''}${terms.length?`<p class="dz-sub">${L('Basic terms used here (see the box at the top of the page):','מונחים בסיסיים בעמוד (ראו את התיבה בראש העמוד):')} ${terms.map(esc).join(', ')}</p>`:''}<p class="dz-sub">${L('Ask me about any of these, or say "quiz me".','שאלו אותי על כל אחד מהם, או כתבו "תבחני אותי".')}</p>`;}
function dzSummary(){const n=dzCurrentLesson();const ls=dzLessons().filter(l=>!n||l.n===n);const box=document.createElement('div');let h='';
  ls.forEach(l=>{try{box.innerHTML=l.R[l.views[0].id]();}catch(e){return;}const c=box.querySelector('.callout.pink');if(!c)return;h+=`<p class="dz-sub">${L('Lesson','שיעור')} ${l.n}: ${esc((c.querySelector('h3')||{}).textContent||'')}</p><ul>${[...c.querySelectorAll('p')].map(p=>`<li>${esc(p.textContent.replace(/^\d+\.\s*/,''))}</li>`).join('')}</ul><div class="dz-links"><a href="#${l.views[0].id}">${L('Open the lesson','לפתוח את השיעור')}</a><a href="#${l.views[l.views.length-2].id}">${L('Take the quiz','לעשות את הבוחן')}</a></div>`;});
  return h||`<p>${L('Open a lesson first.','פתחו קודם שיעור.')}</p>`;}
function dzQuizStart(){const n=dzCurrentLesson();const pool=[];dzLessons().forEach(l=>{if(!n||l.n===n)l.quiz().forEach(q=>pool.push({...q,n:l.n}));});
  const q=pool[Math.floor(Math.random()*pool.length)];const order=q.o.map((_,i)=>i).sort(()=>Math.random()-.5);DAISY.quiz={q,order,done:false};
  return `<p class="dz-sub">${L('Lesson','שיעור')} ${q.n} · ${L('question','שאלה')}</p><p><b>${esc(q.q)}</b></p><div class="dz-opts">${order.map(i=>`<button class="dz-opt" data-o="${i}">${esc(q.o[i])}</button>`).join('')}</div>`;}
function dzQuizAnswer(i,btn){const z=DAISY.quiz;if(!z||z.done)return;z.done=true;const ok=i===z.q.a;
  btn.closest('.dz-opts').querySelectorAll('.dz-opt').forEach(b=>{b.disabled=true;if(+b.dataset.o===z.q.a)b.classList.add('right');else if(b===btn)b.classList.add('wrong');});

function daisyUI(){const fab=document.createElement('button');fab.id='daisyfab';fab.innerHTML=daisyFlower(34);document.body.appendChild(fab);

function daisyLabels(){const f=$('#daisyfab');if(!f)return;f.setAttribute('aria-label',L('Ask dAIsy, the study helper','לשאול את dAIsy, עוזרת הלימוד'));f.title=L('Ask dAIsy','לשאול את dAIsy');$('#daisy').setAttribute('aria-label','dAIsy');if(!$('#daisy').hidden)daisyRender();}
function daisyRender(){const pn=$('#daisy');
