 [['prostaglandins','prostaglandin'],['פרוסטגלנדינים','פרוסטגלנדין'],`Lipid messengers that cause fever, pain and vessel widening. Aspirin blocks them.`,`שליחים ליפידיים שגורמים לחום, לכאב ולהרחבת כלי דם. אספירין חוסם אותם.`],
 [['leukotrienes','leukotriene'],['לויקוטריאנים','לויקוטריאן'],`Lipid messengers that narrow the airways and attract immune cells.`,`שליחים ליפידיים שמצרים את דרכי הנשימה ומושכים תאי חיסון.`],
 [['bradykinin'],['ברדיקינין'],`A small peptide that widens vessels and triggers pain.`,`פפטיד קטן שמרחיב כלי דם ומעורר כאב.`],
 [['endothelium','endothelial'],['אנדותל','האנדותל'],`The single layer of cells that lines every blood vessel.`,`שכבת התאים היחידה שמרפדת כל כלי דם.`],
 [['venules','venule'],['ורידונים','ורידון'],`The smallest veins, right after the capillaries. Cells and fluid leave the blood mostly here.`,`הוורידים הקטנים ביותר, מיד אחרי הנימים. תאים ונוזל יוצאים מהדם בעיקר כאן.`],
 [['arterioles','arteriole'],['עורקיקים','עורקיק'],`The smallest arteries. When they widen, more blood reaches the tissue.`,`העורקים הקטנים ביותר. כשהם מתרחבים, יותר דם מגיע לרקמה.`],
 [['plasma'],['פלזמה'],`The liquid part of blood, without the cells.`,`החלק הנוזלי של הדם, בלי התאים.`],
 [['clotting factors'],['גורמי קרישה'],`Blood proteins that together form a clot.`,`חלבוני דם שיחד יוצרים קריש.`],
 [['steroids'],['סטרואידים'],`Anti-inflammatory hormone drugs (such as cortisone) that broadly suppress immunity.`,`תרופות הורמונליות נוגדות דלקת (כמו קורטיזון) שמדכאות את מערכת החיסון באופן רחב.`],
 [['aspirin'],['אספירין'],`A drug that blocks the enzymes that make prostaglandins.`,`תרופה שחוסמת את האנזימים שמייצרים פרוסטגלנדינים.`],
 [['fibrosis'],['פיברוזיס'],`Replacement of normal tissue by scar tissue (collagen), which then loses its function.`,`החלפת רקמה רגילה ברקמת צלקת (קולגן), שמאבדת את תפקודה.`],
 [['collagen'],['קולגן'],`The main structural protein of connective tissue and of scars.`,`החלבון המבני העיקרי של רקמת חיבור ושל צלקות.`],
 [['extracellular matrix'],['מטריקס חוץ-תאי'],`The mesh of proteins and sugars that surrounds and supports cells.`,`הרשת של חלבונים וסוכרים שמקיפה את התאים ותומכת בהם.`],
 [['growth factor','growth factors'],['פקטור גדילה','פקטורי גדילה'],`A protein that tells cells to grow or divide.`,`חלבון שאומר לתאים לגדול או להתחלק.`],
 [['EGFR'],['EGFR'],`The receptor for epidermal growth factor; it drives growth and repair of epithelial cells.`,`הקולטן לפקטור הגדילה האפידרמלי; מניע גדילה ותיקון של תאי אפיתל.`],
 [['cytochrome c'],['ציטוכרום c'],`A protein of the mitochondrial energy chain. Released into the cytosol, it triggers apoptosis.`,`חלבון בשרשרת האנרגיה של המיטוכונדריה. כשהוא משתחרר לציטוזול הוא מפעיל אפופטוזיס.`],
 [['aspartic acid'],['חומצה אספרטית'],`An amino acid. Caspases cut proteins right after it.`,`חומצת אמינו. קספאזות חותכות חלבונים מיד אחריה.`],
 [['cysteine'],['ציסטאין'],`An amino acid. In caspases it sits in the active site that does the cutting.`,`חומצת אמינו. בקספאזות היא נמצאת באתר הפעיל שעושה את החיתוך.`],
 [['cytoskeleton'],['שלד התא'],`The internal protein scaffold that gives a cell its shape.`,`שלד החלבונים הפנימי שנותן לתא את צורתו.`],
 [['lipid'],['ליפיד'],`A fat molecule. Cell membranes are made of lipids.`,`מולקולת שומן. ממברנות של תאים בנויות מליפידים.`],
 [['Fc receptors','Fc receptor'],['קולטני Fc','קולטן Fc'],`Receptors on immune cells that grab the tail (Fc) of an antibody.`,`קולטנים על תאי חיסון שנאחזים בזנב (Fc) של נוגדן.`],
 [['IgG'],['IgG'],`The main antibody class in the blood.`,`סוג הנוגדנים העיקרי בדם.`],
 [['IgE'],['IgE'],`The antibody class of allergy and of defence against worms.`,`סוג הנוגדנים של אלרגיה ושל הגנה מפני תולעים.`],
 [['HLA'],['HLA'],`Human leukocyte antigen: the human version of MHC.`,`HLA: הגרסה האנושית של MHC.`],
 [['Th1','Th2','Th17'],['Th1','Th2','Th17'],`Types of helper T cells: Th1 against microbes inside cells, Th2 against worms and in allergy, Th17 against bacteria and fungi at barriers.`,`סוגים של תאי T מסייעים: Th1 נגד מיקרואורגניזמים בתוך תאים, Th2 נגד תולעים ובאלרגיה, Th17 נגד חיידקים ופטריות במחסומים.`],
 [['retinoic acid'],['חומצה רטינואית'],`A molecule made from vitamin A that guides some immune cells.`,`מולקולה שנוצרת מוויטמין A ומכוונת חלק מתאי החיסון.`],
 [['haemagglutinin'],['המאגלוטינין'],`A protein on the surface of viruses such as influenza that helps them attach to our cells.`,`חלבון על פני נגיפים כמו שפעת שעוזר להם להיצמד לתאים שלנו.`],
 [['lupus'],['זאבת'],`An autoimmune disease in which the body attacks its own DNA and other molecules.`,`מחלה אוטואימונית שבה הגוף תוקף את ה-DNA שלו ומולקולות אחרות.`],
 [['autoimmunity'],['אוטואימוניות'],`When the immune system attacks the body's own tissues.`,`מצב שבו מערכת החיסון תוקפת את רקמות הגוף עצמו.`],
 [['NF-κB'],['NF-κB'],`The master transcription factor that switches on inflammation genes.`,`פקטור השעתוק המרכזי שמפעיל את הגנים של הדלקת.`],
 [['potassium'],['אשלגן'],`An ion (K⁺) kept at high levels inside cells. When it leaks out, the membrane is damaged.`,`יון (K⁺) שנשמר בריכוז גבוה בתוך התאים. כשהוא דולף החוצה, הממברנה פגועה.`],
 [['phagocytosis'],['פגוציטוזה'],`Engulfing a microbe or particle into the cell.`,`בליעה של מיקרואורגניזם או חלקיק לתוך התא.`],
 [['antigen','antigens'],['אנטיגן','אנטיגנים'],`Any molecule that immune cells can recognise.`,`כל מולקולה שתאי חיסון יכולים לזהות.`],
 [['MHC'],['MHC'],`Molecules that display protein fragments on the cell surface for T cells to inspect.`,`מולקולות שמציגות קטעי חלבון על פני התא כדי שתאי T יבדקו אותם.`],
 [['superoxide'],['סופראוקסיד'],`A reactive form of oxygen (O₂⁻) that damages microbes.`,`צורה פעילה של חמצן (O₂⁻) שפוגעת במיקרואורגניזמים.`],
 [['chromatin'],['כרומטין'],`DNA wrapped around proteins, the way it is packed in the nucleus.`,`DNA שכרוך סביב חלבונים, כפי שהוא ארוז בגרעין.`],
 [['lipid bilayer'],['שכבת השומנים הכפולה'],`The two-layer sheet of fat molecules that forms every cell membrane.`,`היריעה הכפולה של מולקולות שומן שבונה כל ממברנה של תא.`],
 [['helminths','helminth'],['הלמינתים'],`Parasitic worms.`,`תולעים טפיליות.`],
 [['anaphylaxis'],['אנפילקסיס'],`A severe allergic reaction of the whole body that can be life-threatening.`,`תגובה אלרגית קשה של כל הגוף שעלולה לסכן חיים.`],
 [['urticaria'],['אורטיקריה'],`Hives: itchy raised patches on the skin.`,`סרפדת: כתמים מורמים ומגרדים על העור.`],
 [['heparin'],['הפרין'],`A sugar molecule that prevents blood from clotting.`,`מולקולת סוכר שמונעת קרישת דם.`],
 [['interstitial'],['בין-תאי'],`In the space between cells in a tissue.`,`במרווח שבין התאים ברקמה.`],
 [['thoracic duct'],['הצינור החזי'],`The largest lymph vessel. It empties lymph into a large vein near the neck.`,`כלי הלימפה הגדול ביותר. הוא מרוקן את הלימפה לווריד גדול ליד הצוואר.`],
 [['naïve','naive'],['נאיביים','נאיבי'],`A T or B cell that has not met its antigen yet.`,`תא T או B שעוד לא פגש את האנטיגן שלו.`],
 [['effector'],['אפקטור','אפקטוריים'],`An activated immune cell that does the actual work: kills, helps or makes antibodies.`,`תא חיסון משופעל שעושה את העבודה בפועל: הורג, מסייע או מייצר נוגדנים.`],
 [['epithelium','epithelial'],['אפיתל'],`The layer of cells that covers surfaces such as skin, gut and airways.`,`שכבת התאים שמכסה משטחים כמו העור, המעי ודרכי הנשימה.`],
 [['germline'],['הדנ״א התורשתי'],`The inherited DNA, the same in every cell and not rearranged.`,`ה-DNA התורשתי, זהה בכל תא ולא עובר שחלוף.`],
 [['clonal selection'],['ברירה שבטית'],`Only the lymphocyte whose receptor matches the antigen is chosen to multiply.`,`רק הלימפוציט שהקולטן שלו מתאים לאנטיגן נבחר להתרבות.`],
 [['apoptosis'],['אפופטוזיס'],`Programmed, quiet cell death in which the cell breaks into sealed fragments.`,`מוות תאי מתוכנת ושקט שבו התא מתפרק לשברים סגורים.`],
 [['caspase','caspases'],['קספאז','קספאזות'],`An enzyme that cuts proteins and takes the cell apart during programmed death.`,`אנזים שחותך חלבונים ומפרק את התא במוות מתוכנת.`]
];

/* ---------- hover-definition engine ---------- */
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
let TIPRX={en:null,he:null};
function tipRegexes(){const he=LANG==='he';if(TIPRX[LANG])return TIPRX[LANG];
  const list=[];TIPS.forEach((tp,i)=>(he?tp[1]:tp[0]).forEach(f=>list.push({f,i})));list.sort((a,b)=>b.f.length-a.f.length);
  list.forEach(x=>{x.rx=he?new RegExp(`(^|[^\\u0590-\\u05FFA-Za-z0-9])([ובכלמשה]{0,3})(${reEsc(x.f)})(?![\\u0590-\\u05FFA-Za-z0-9])`):new RegExp(`(^|[^A-Za-z0-9-])(${reEsc(x.f)})(?![A-Za-z0-9])`,x.f===x.f.toLowerCase()?'i':'');});
  return TIPRX[LANG]=list;}
const TIP_SKIP='svg,a,button,h1,h2,h3,h4,summary,.tip,.pill,.eyebrow,th,dt,label,input,script,style,.mono,.seg,.steps,.filters,.flip,.qopts,#tipbox';
function annotate(root){if(!root||root.nodeType!==1||root.closest('.tip,svg'))return;const he=LANG==='he';const used=new Set();
  for(const x of tipRegexes()){if(used.has(x.i))continue;
    const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
    while(n=tw.nextNode()){const p=n.parentElement;if(!p||p.closest(TIP_SKIP)||!p.closest('p,li,dd,td,figcaption,.callout,.node,.expl'))continue;
      const m=x.rx.exec(n.nodeValue);if(!m)continue;
      const start=m.index+m[1].length+(he?m[2].length:0), word=he?m[3]:m[2];
      const after=n.splitText(start);after.nodeValue=after.nodeValue.slice(word.length);
      const sp=document.createElement('span');sp.className='tip';sp.tabIndex=0;sp.dataset.t=x.i;sp.textContent=word;p.insertBefore(sp,after);
      used.add(x.i);break;}}}
const tipbox=document.createElement('div');tipbox.id='tipbox';tipbox.setAttribute('role','tooltip');tipbox.hidden=true;document.body.appendChild(tipbox);
let tipOn=null;
function showTip(el){const tp=TIPS[+el.dataset.t];if(!tp)return;tipbox.innerHTML=`<b>${esc(el.textContent)}</b> ${esc(L(tp[2],tp[3]))}`;tipbox.hidden=false;tipbox.style.left='0px';tipbox.style.top='0px';
  const r=el.getBoundingClientRect(),bw=tipbox.offsetWidth,bh=tipbox.offsetHeight;const left=Math.max(8,Math.min(innerWidth-bw-8,r.left+r.width/2-bw/2));let top=r.top-bh-10,below=false;if(top<8){top=r.bottom+10;below=true;}
  tipbox.style.left=left+'px';tipbox.style.top=top+'px';tipbox.classList.toggle('below',below);tipbox.style.setProperty('--ax',Math.max(12,Math.min(bw-12,r.left+r.width/2-left))+'px');tipOn=el;}
function hideTip(){tipbox.hidden=true;tipOn=null;}
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('.tip');if(el&&el!==tipOn)showTip(el);});
document.addEventListener('mouseout',e=>{const el=e.target.closest&&e.target.closest('.tip');if(el&&!el.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('tip'))showTip(e.target);});
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('tip'))hideTip();});
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('.tip');if(el){if(tipOn!==el)showTip(el);}else if(tipOn)hideTip();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip();});
addEventListener('scroll',()=>{if(tipOn)hideTip();},{passive:true});
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1&&!n.classList.contains('tip'))annotate(n);}).observe(document.getElementById('main'),{childList:true,subtree:true});

function lessonOf(id){
  if(VIEWS.some(x=>x.id===id))return {n:1,views:VIEWS,R:LANG==='he'?RH:R,I:INIT,name:u('subname')};
  const v2=l2views();if(v2.some(x=>x.id===id))return {n:2,views:v2,R:R2,I:INIT2,name:L('Innate immunity: functional mechanisms','חסינות מולדת: מנגנוני פעולה')};
  return null;}
function route(){
  hideTip();
  const id=(location.hash||'#home').slice(1);
  const ls=lessonOf(id);
  $('#sub').hidden=!ls; $('#prog').hidden=!ls; $('#lmenu').open=false;
  const RV=LANG==='he'?RH:R;
  if(!ls){$('#main').innerHTML=RV.home();window.scrollTo(0,0);return;}
  const les=LESSONS[ls.n-1];
  $('#subnum').textContent=`${L('Lesson','שיעור')} ${les[0]} · ${les[1]}`;$('#subname').textContent=ls.name;
  $('#tabs').innerHTML=ls.views.map(v=>`<a href="#${v.id}" data-v="${v.id}">${v.label}</a>`).join('');
  $('#main').innerHTML=ls.R[id]();ls.I[id]&&ls.I[id]();
  document.querySelectorAll('#tabs a').forEach(a=>{const on=a.dataset.v===id;a.toggleAttribute('aria-current',on);if(on){a.setAttribute('aria-current','page');a.scrollIntoView({block:'nearest',inline:'center'})}});
  visited.add(id);try{localStorage.setItem('imm1-visited',JSON.stringify([...visited]))}catch(e){}
  $('#progbar').style.width=Math.round(ls.views.filter(v=>visited.has(v.id)).length/ls.views.length*100)+'%';
  window.scrollTo(0,0);
}
let initLang='en';try{initLang=localStorage.getItem('imm-lang')||((navigator.language||'').toLowerCase().startsWith('he')?'he':'en')}catch(e){}
setLang(initLang);
window.addEventListener('hashchange',route);route();
</script>
